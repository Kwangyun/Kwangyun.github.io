<!-- Kwang Security — Premium Consulting Design -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════════════════ */
:root {
  --bg:          #ffffff;
  --bg-alt:      #f8fafc;
  --surface:     #ffffff;
  --surface-2:   #f1f5f9;
  --border:      rgba(15,23,42,0.08);
  --border-2:    rgba(15,23,42,0.14);
  --text:        #0f172a;
  --text-2:      #475569;
  --text-3:      #94a3b8;
  --blue:        #0d9488;
  --blue-h:      #0f766e;
  --purple:      #14b8a6;
  --blue-glow:   rgba(13,148,136,0.22);
  --r:           10px;
  --ease:        cubic-bezier(0.16, 1, 0.3, 1);
}

/* Animated gradient border for featured card */
@property --ba {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

/* ═══════════════════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, sans-serif !important;
  background: #ffffff !important;
  color: #0f172a !important;
  -webkit-font-smoothing: antialiased !important;
  -moz-osx-font-smoothing: grayscale !important;
  overflow-x: hidden !important;
}
h1,h2,h3,h4,h5,h6 { font-family: 'Plus Jakarta Sans', sans-serif !important; }
a { color: var(--blue) !important; text-decoration: none !important; transition: color .2s !important; }
a:hover { color: var(--blue-h) !important; }
img { max-width: 100%; }
::selection { background: rgba(77,124,254,.28); color: #fff; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(77,124,254,.45); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--blue); }

/* ═══════════════════════════════════════════════════════════
   GRID OVERLAY (Vercel-style, masked, fades at edges)
═══════════════════════════════════════════════════════════ */
#grid-overlay { display: none; }

/* ═══════════════════════════════════════════════════════════
   LAYOUT KILL — strip MM constraints for homepage
═══════════════════════════════════════════════════════════ */
#main, .initial-content, .page,
.page__inner-wrap, #page-content {
  max-width: 100% !important;
  width: 100%  !important;
  padding: 0   !important;
  margin: 0    !important;
  float: none  !important;
}
.page__content { width: 100% !important; float: none !important; }

/* ═══════════════════════════════════════════════════════════
   MASTHEAD
═══════════════════════════════════════════════════════════ */
.masthead {
  position: fixed !important;
  top: 0; left: 0; right: 0;
  z-index: 1000 !important;
  background: rgba(255,255,255,.9) !important;
  backdrop-filter: saturate(180%) blur(14px) !important;
  -webkit-backdrop-filter: saturate(180%) blur(14px) !important;
  border-bottom: 1px solid rgba(15,23,42,.08) !important;
  box-shadow: 0 1px 3px rgba(15,23,42,.03) !important;
  transition: background .3s !important;
}
.masthead.scrolled { background: rgba(255,255,255,.98) !important; }
.masthead__inner-wrap { padding: 0 5% !important; }
.site-title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-weight: 800 !important;
  font-size: .95em !important;
  letter-spacing: -.01em !important;
  color: var(--text) !important;
}
.site-title:hover { color: var(--blue) !important; }
.greedy-nav a, .masthead__menu-item a {
  font-family: 'Inter', sans-serif !important;
  font-size: .82em !important; font-weight: 500 !important;
  letter-spacing: .01em !important;
  color: var(--text-2) !important;
  transition: color .2s !important;
  position: relative;
}
.masthead__menu-item a::after {
  content: '';
  position: absolute; bottom: -2px; left: 0;
  width: 0; height: 1px;
  background: var(--blue);
  transition: width .25s var(--ease);
}
.masthead__menu-item a:hover { color: var(--text) !important; }
.masthead__menu-item a:hover::after { width: 100%; }

/* ═══════════════════════════════════════════════════════════
   LAYOUT WRAPPER
═══════════════════════════════════════════════════════════ */
.c-wrap { max-width: 1120px; margin: 0 auto; padding: 0 5%; }

/* ═══════════════════════════════════════════════════════════
   KEYFRAMES
═══════════════════════════════════════════════════════════ */
@keyframes blob1 {
  0%,100% { transform: translate(0,0) scale(1); }
  40%     { transform: translate(60px,-80px) scale(1.1); }
  70%     { transform: translate(-40px,40px) scale(.95); }
}
@keyframes blob2 {
  0%,100% { transform: translate(0,0) scale(1); }
  35%     { transform: translate(-50px,60px) scale(1.08); }
  65%     { transform: translate(40px,-30px) scale(.92); }
}
@keyframes blob3 {
  0%,100% { transform: translate(0,0) scale(1); }
  50%     { transform: translate(30px,50px) scale(1.06); }
}
@keyframes shimmer {
  0%   { background-position: -400% 0; }
  100% { background-position:  400% 0; }
}
@keyframes spin-border {
  to { --ba: 360deg; }
}
@keyframes fade-up {
  from { opacity:0; transform: translateY(28px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes count-glow {
  0%,100% { text-shadow: 0 0 20px rgba(77,124,254,.5); }
  50%     { text-shadow: 0 0 40px rgba(77,124,254,.9), 0 0 80px rgba(77,124,254,.3); }
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-8px); }
}
@keyframes pulse-ring {
  0%   { box-shadow: 0 0 0 0 rgba(77,124,254,.35); }
  70%  { box-shadow: 0 0 0 10px rgba(77,124,254,0); }
  100% { box-shadow: 0 0 0 0 rgba(77,124,254,0); }
}

/* ═══════════════════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════════════════ */
.c-btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 13px 28px;
  font-family: 'Inter', sans-serif !important;
  font-size: .85em; font-weight: 600;
  border-radius: 6px;
  text-decoration: none !important;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s;
  cursor: pointer; position: relative; overflow: hidden;
  white-space: nowrap;
}
.c-btn--primary {
  background: var(--blue);
  color: #fff !important;
  box-shadow: 0 0 0 1px rgba(77,124,254,.5), 0 4px 24px rgba(77,124,254,.35);
}
.c-btn--primary::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg,
    transparent 0%, rgba(255,255,255,.18) 50%, transparent 100%);
  background-size: 400% 100%;
  animation: shimmer 3.5s infinite;
}
.c-btn--primary:hover {
  background: var(--blue-h) !important;
  color: #fff !important;
  box-shadow: 0 0 0 1px rgba(107,148,255,.6), 0 8px 36px rgba(77,124,254,.5);
  transform: translateY(-2px);
}
.c-btn--ghost {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  color: #0f172a !important;
}
.c-btn--ghost:hover {
  background: #f8fafc;
  border-color: #0d9488;
  color: #0d9488 !important;
  transform: translateY(-2px);
}
.c-btn--full { width: 100%; }

/* ═══════════════════════════════════════════════════════════
   LABEL
═══════════════════════════════════════════════════════════ */
.c-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Inter', sans-serif !important;
  font-size: .7em; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--blue) !important;
  margin-bottom: 1em;
}
.c-label::before {
  content: '';
  display: inline-block; width: 6px; height: 6px;
  background: var(--blue); border-radius: 50%;
  animation: pulse-ring 2s infinite;
}

/* ═══════════════════════════════════════════════════════════
   HERO
═══════════════════════════════════════════════════════════ */
.c-hero {
  position: relative;
  min-height: 100vh;
  display: flex; align-items: center;
  padding: 140px 5% 100px;
  overflow: hidden;
  border-bottom: 1px solid rgba(15,23,42,0.06);
  background: #ffffff;
}

/* Animated light-theme background — floating teal/cyan blobs */
.c-hero::before {
  content: '';
  position: absolute;
  top: -200px; left: -150px;
  width: 700px; height: 700px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(13,148,136,0.18) 0%, rgba(13,148,136,0) 60%);
  filter: blur(40px);
  animation: blob-drift-a 16s ease-in-out infinite;
  z-index: 0;
  pointer-events: none;
}
.c-hero::after {
  content: '';
  position: absolute;
  bottom: -200px; right: -150px;
  width: 650px; height: 650px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(6,182,212,0.14) 0%, rgba(6,182,212,0) 60%);
  filter: blur(50px);
  animation: blob-drift-b 20s ease-in-out infinite;
  z-index: 0;
  pointer-events: none;
}
.c-hero__inner { position: relative; z-index: 2; }

@keyframes blob-drift-a {
  0%,100% { transform: translate(0,0) scale(1); }
  33%     { transform: translate(120px,80px) scale(1.08); }
  66%     { transform: translate(-60px,140px) scale(.95); }
}
@keyframes blob-drift-b {
  0%,100% { transform: translate(0,0) scale(1); }
  40%     { transform: translate(-140px,-60px) scale(1.1); }
  70%     { transform: translate(80px,-120px) scale(.92); }
}

/* Beam of light from top — Vercel style */
.c-beam {
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 2px; height: 45vh;
  background: linear-gradient(to bottom,
    rgba(77,124,254,0),
    rgba(77,124,254,0.9) 25%,
    rgba(77,124,254,0.45) 70%,
    rgba(77,124,254,0)
  );
  filter: blur(1.5px);
  pointer-events: none; z-index: 2;
}
/* Glow halo at beam origin */
.c-beam-glow {
  position: absolute;
  top: -60px; left: 50%; transform: translateX(-50%);
  width: 700px; height: 400px;
  background: radial-gradient(ellipse 60% 50% at 50% 0%,
    rgba(77,124,254,0.18) 0%,
    rgba(139,92,246,0.08) 40%,
    transparent 70%
  );
  pointer-events: none; z-index: 2;
}

.c-hero__inner { max-width: 860px; position: relative; z-index: 5; }

.c-hero__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: clamp(3em, 7vw, 5.5em) !important;
  font-weight: 800 !important;
  line-height: 1.05 !important;
  letter-spacing: -.03em !important;
  color: var(--text) !important;
  margin: .25em 0 .5em !important;
}

/* Gradient on accent word */
.c-grad {
  background: linear-gradient(135deg, #6b9fff 0%, #c084fc 55%, #818cf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.c-hero__sub {
  font-size: 1.12em !important; line-height: 1.78 !important;
  color: var(--text-2) !important;
  max-width: 580px; margin-bottom: 2.6em !important;
}
.c-hero__cta { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 3em; }

/* Trust strip */
.c-trust { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.c-trust__label {
  font-size: .7em; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-3);
}
.c-trust__items { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.c-trust__item {
  font-size: .8em; font-weight: 600;
  color: var(--text-2); letter-spacing: .01em;
  transition: color .2s;
}
.c-trust__item:hover { color: var(--text); }
.c-trust__sep { color: var(--text-3); }

/* ═══════════════════════════════════════════════════════════
   METRICS
═══════════════════════════════════════════════════════════ */
.c-metrics {
  display: flex;
  background: #f8fafc;
  border-bottom: 1px solid rgba(15,23,42,0.08);
  border-top: 1px solid rgba(15,23,42,0.06);
  position: relative; z-index: 2;
}
.c-metric {
  flex: 1; text-align: center;
  padding: 40px 20px;
  border-right: 1px solid var(--border);
  transition: background .25s;
  position: relative;
}
.c-metric:last-child { border-right: none; }
.c-metric::after {
  content: '';
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 0; height: 2px; background: var(--blue);
  transition: width .35s var(--ease);
}
.c-metric:hover { background: rgba(77,124,254,.04); }
.c-metric:hover::after { width: 60%; }
.c-metric__num {
  display: block;
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: 2.8em; font-weight: 800;
  letter-spacing: -.04em;
  color: var(--text) !important;
  line-height: 1; margin-bottom: 10px;
  animation: count-glow 4s ease-in-out infinite;
}
.c-metric__label {
  display: block; font-size: .67em; font-weight: 500;
  color: var(--text-3);
  letter-spacing: .12em; text-transform: uppercase;
}

/* ═══════════════════════════════════════════════════════════
   SECTIONS
═══════════════════════════════════════════════════════════ */
.c-section {
  padding: 110px 0;
  border-bottom: 1px solid rgba(15,23,42,0.06);
  background: #ffffff;
  position: relative; z-index: 2;
}
.c-section--alt {
  background: #f8fafc;
}

.c-section__head { max-width: 640px; margin-bottom: 4.5em; }
.c-section__head--row {
  max-width: 100%; display: flex; align-items: flex-end;
  justify-content: space-between; margin-bottom: 3em;
}

.c-section__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: clamp(2em, 4vw, 3em) !important;
  font-weight: 800 !important;
  letter-spacing: -.03em !important;
  color: var(--text) !important;
  line-height: 1.1 !important;
  margin: 0 0 .65em !important;
}
.c-section__sub {
  font-size: 1em; line-height: 1.78;
  color: var(--text-2); margin: 0;
}

/* ═══════════════════════════════════════════════════════════
   SERVICE CARDS
═══════════════════════════════════════════════════════════ */
.c-services {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
}
@media (max-width: 700px) { .c-services { grid-template-columns: 1fr; } }

.c-service {
  background: #ffffff;
  padding: 44px 40px;
  transition: background .25s, transform .25s var(--ease), box-shadow .25s;
  position: relative; overflow: hidden;
  cursor: default;
}
/* Top accent line reveals on hover */
.c-service::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--blue), var(--purple));
  transform: scaleX(0); transform-origin: left;
  transition: transform .35s var(--ease);
}
/* Subtle shine sweep on hover */
.c-service::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(105deg,
    transparent 35%, rgba(255,255,255,.03) 50%, transparent 65%);
  background-size: 250% 100%;
  background-position: -100% 0;
  transition: background-position .55s var(--ease);
}
.c-service:hover { background: var(--surface-2); transform: translateY(-3px); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.c-service:hover::before { transform: scaleX(1); }
.c-service:hover::after { background-position: 200% 0; }

.c-service__icon {
  width: 42px; height: 42px; color: var(--blue);
  margin-bottom: 1.5em;
  transition: transform .3s var(--ease), color .25s;
}
.c-service:hover .c-service__icon { transform: scale(1.1) translateY(-2px); }

.c-service h3 {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: 1.08em !important; font-weight: 700 !important;
  letter-spacing: -.01em !important;
  color: var(--text) !important;
  margin: 0 0 .85em !important;
}
.c-service p {
  font-size: .9em; line-height: 1.75; color: var(--text-2); margin-bottom: 1.5em;
}
.c-service__list {
  list-style: none; padding: 0; margin: 0;
  border-top: 1px solid var(--border); padding-top: 1.3em;
}
.c-service__list li {
  font-size: .82em; color: var(--text-2);
  padding: 6px 0; border-bottom: 1px solid rgba(15,23,42,.05);
  display: flex; align-items: center; gap: 10px;
}
.c-service__list li::before {
  content: ''; display: inline-block;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--blue); flex-shrink: 0; opacity: .7;
}

/* ═══════════════════════════════════════════════════════════
   PROCESS — Ellis /visas/o1 replica
   White background, teal accent, connected horizontal timeline
═══════════════════════════════════════════════════════════ */
.c-process-section {
  background: #ffffff;
  color: #0f172a;
  padding: 140px 5% 160px;
  position: relative;
  z-index: 3;
  border-top: 1px solid rgba(15,23,42,0.06);
  border-bottom: 1px solid rgba(15,23,42,0.06);
  overflow: hidden;
}

.c-process-wrap { position: relative; z-index: 1; }

/* ── Live dot on eyebrow ─────────────────────────────────── */
.c-live-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #10b981;
  margin-right: 8px;
  position: relative;
  animation: live-dot-pulse 1.5s ease-in-out infinite;
}
.c-live-dot::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid #10b981;
  opacity: 0;
  animation: live-dot-ring 1.5s ease-out infinite;
}
@keyframes live-dot-pulse {
  0%,100% { background: #10b981; }
  50%     { background: #34d399; }
}
@keyframes live-dot-ring {
  0%   { transform: scale(0.8); opacity: .8; }
  100% { transform: scale(1.8); opacity: 0; }
}

/* ── Live metrics bar ────────────────────────────────────── */
.c-process-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: #e2e8f0;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  overflow: hidden;
  max-width: 900px;
  margin: 0 auto 60px;
  box-shadow: 0 4px 24px rgba(13,148,136,.06);
}
@media (max-width: 700px) {
  .c-process-metrics { grid-template-columns: repeat(2, 1fr); }
}
.c-pm {
  background: #ffffff;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: background .3s ease;
}
.c-pm:hover { background: #f8fafc; }
.c-pm__label {
  font-family: 'Inter', sans-serif;
  font-size: .7em;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #94a3b8;
}
.c-pm__value {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 1.2em;
  font-weight: 700;
  letter-spacing: -.02em;
  color: #0f172a;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color .3s ease;
  font-variant-numeric: tabular-nums;
}
.c-pm[data-highlight="true"] .c-pm__value { color: #0d9488; }
.c-pm__pulse {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 0 rgba(16,185,129,.5);
  animation: pm-pulse 1.4s ease-in-out infinite;
}
@keyframes pm-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(16,185,129,.5); }
  70%  { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
  100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
}

/* ── Flowing data dots along timeline track ──────────────── */
.c-timeline__flow {
  position: absolute;
  top: 36px;
  left: calc(12.5% + 40px);
  right: calc(12.5% + 40px);
  height: 2px;
  z-index: 3;
  pointer-events: none;
}
.c-flow-dot {
  position: absolute;
  top: 50%;
  left: 0;
  width: 10px; height: 10px;
  margin-top: -5px;
  border-radius: 50%;
  background: #0d9488;
  box-shadow: 0 0 12px rgba(13,148,136,.8), 0 0 24px rgba(13,148,136,.4);
  transform: translateX(-5px);
  animation: flow-dot 4s linear infinite;
  opacity: 0;
}
.c-flow-dot:nth-child(1) { animation-delay: 0s;   }
.c-flow-dot:nth-child(2) { animation-delay: 0.8s; }
.c-flow-dot:nth-child(3) { animation-delay: 1.6s; }
.c-flow-dot:nth-child(4) { animation-delay: 2.4s; }
.c-flow-dot:nth-child(5) { animation-delay: 3.2s; }
@keyframes flow-dot {
  0%   { left: 0%;   opacity: 0; transform: translateX(-5px) scale(0.6); }
  10%  { opacity: 1; transform: translateX(-5px) scale(1); }
  90%  { opacity: 1; transform: translateX(-5px) scale(1); }
  100% { left: 100%; opacity: 0; transform: translateX(-5px) scale(0.6); }
}

@media (max-width: 780px) {
  .c-timeline__flow { display: none; }
}

.c-process-wrap {
  max-width: 1200px;
  margin: 0 auto;
}

.c-process-head {
  max-width: 780px;
  margin: 0 auto 90px;
  text-align: center;
  position: relative;
}

.c-process-eyebrow {
  display: inline-block;
  font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #0d9488;
  margin-bottom: 22px;
}

.c-process-title {
  font-family: 'Inter', 'Plus Jakarta Sans', sans-serif !important;
  font-size: clamp(2.1em, 4.4vw, 3.4em) !important;
  font-weight: 700 !important;
  letter-spacing: -.032em !important;
  line-height: 1.08 !important;
  color: #0f172a !important;
  margin: 0 0 .5em !important;
}

.c-process-lede {
  font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
  font-size: 1.08em;
  line-height: 1.7;
  color: #475569;
  margin: 0 auto 32px;
  max-width: 620px;
}

.c-process-total {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 14px 24px;
  border: 1px solid #e2e8f0;
  background: #f8fafc;
  border-radius: 14px;
}
.c-process-total__num {
  font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
  font-size: 2.2em;
  font-weight: 700;
  letter-spacing: -.04em;
  color: #0d9488;
  line-height: 1;
}
.c-process-total__label {
  font-size: .78em;
  font-weight: 500;
  color: #475569;
  text-align: left;
  line-height: 1.4;
  letter-spacing: .02em;
}

/* ── CONNECTED TIMELINE (all 4 steps visible) ──────────────── */
.c-timeline {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  padding: 0 40px;
  margin-bottom: 80px;
}

/* Track (full gray line behind everything) */
.c-timeline__track {
  position: absolute;
  top: 36px;
  left: calc(12.5% + 40px);
  right: calc(12.5% + 40px);
  height: 2px;
  background: #e2e8f0;
  z-index: 0;
}

/* Filled portion of the track — teal — grows based on active step */
.c-timeline__track-fill {
  position: absolute;
  top: 36px;
  left: calc(12.5% + 40px);
  width: 0%;
  height: 2px;
  background: linear-gradient(90deg, #0d9488, #14b8a6);
  z-index: 1;
  transition: width .6s cubic-bezier(.22,.61,.36,1);
}

.c-timeline__step {
  position: relative;
  z-index: 2;
  text-align: center;
  cursor: pointer;
  padding-top: 0;
  transition: transform .25s ease;
}
.c-timeline__step:hover { transform: translateY(-2px); }

.c-timeline__node {
  width: 72px;
  height: 72px;
  margin: 0 auto 22px;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
  font-size: 1.25em;
  font-weight: 700;
  letter-spacing: -.01em;
  color: #94a3b8;
  transition: all .35s cubic-bezier(.22,.61,.36,1);
  box-shadow: 0 1px 2px rgba(15,23,42,.04);
}
.c-timeline__step.is-active .c-timeline__node {
  background: #0d9488;
  border-color: #0d9488;
  color: #ffffff;
  box-shadow: 0 6px 20px rgba(13,148,136,.28), 0 0 0 6px rgba(13,148,136,.1);
  transform: scale(1.05);
}
.c-timeline__step.is-complete .c-timeline__node {
  background: #f0fdfa;
  border-color: #0d9488;
  color: #0d9488;
}

.c-timeline__caption {
  max-width: 200px;
  margin: 0 auto;
}
.c-timeline__duration {
  font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
  font-size: .78em;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #0d9488;
  margin-bottom: 8px;
}
.c-timeline__caption-title {
  font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
  font-size: .98em;
  font-weight: 600;
  letter-spacing: -.01em;
  color: #0f172a;
  line-height: 1.35;
}
.c-timeline__step:not(.is-active) .c-timeline__caption-title { color: #475569; }

@media (max-width: 780px) {
  .c-timeline {
    grid-template-columns: 1fr;
    gap: 36px;
    padding: 0 10px;
  }
  .c-timeline__track,
  .c-timeline__track-fill { display: none; }
  .c-timeline__node { width: 60px; height: 60px; font-size: 1.1em; }
}

/* ── SECONDARY TAB ROW + EXPAND PANEL ──────────────────────── */
.c-process-detail {
  max-width: 920px;
  margin: 0 auto;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  overflow: hidden;
  background: #ffffff;
  box-shadow: 0 1px 3px rgba(15,23,42,.04), 0 10px 40px rgba(15,23,42,.04);
}

.c-process-detail__tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid #e2e8f0;
  background: #f8fafc;
}
.c-process-detail__tab {
  background: transparent;
  border: none;
  padding: 20px 16px;
  font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
  font-size: .92em;
  font-weight: 600;
  letter-spacing: -.01em;
  color: #64748b;
  cursor: pointer;
  position: relative;
  transition: color .2s ease, background .2s ease;
  border-right: 1px solid #e2e8f0;
}
.c-process-detail__tab:last-child { border-right: none; }
.c-process-detail__tab:hover { color: #0f172a; background: #f1f5f9; }

.c-process-detail__tab::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 2px;
  background: #0d9488;
  transform: scaleX(0);
  transition: transform .3s cubic-bezier(.22,.61,.36,1);
}
.c-process-detail__tab.is-active {
  color: #0d9488;
  background: #ffffff;
}
.c-process-detail__tab.is-active::after { transform: scaleX(1); }

.c-process-detail__body {
  padding: 44px 52px 48px;
}
@media (max-width: 700px) {
  .c-process-detail__body { padding: 32px 24px; }
  .c-process-detail__tab { font-size: .82em; padding: 16px 8px; }
}

.c-process-detail__panel { display: none; }
.c-process-detail__panel.is-active {
  display: block;
  animation: panel-in .4s cubic-bezier(.22,.61,.36,1);
}
@keyframes panel-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.c-process-detail__panel p {
  font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
  font-size: 1.02em;
  line-height: 1.78;
  color: #334155;
  margin: 0 0 1.8em;
}

.c-process-detail__panel ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 36px;
  padding-top: 28px;
  border-top: 1px solid #e2e8f0;
}
@media (max-width: 600px) {
  .c-process-detail__panel ul { grid-template-columns: 1fr; }
}
.c-process-detail__panel li {
  font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
  font-size: .95em;
  color: #334155;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  line-height: 1.55;
}
.c-process-detail__panel li::before {
  content: '';
  width: 18px; height: 18px;
  flex-shrink: 0;
  margin-top: 1px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d9488' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
  background-size: contain;
  background-repeat: no-repeat;
}

/* ═══════════════════════════════════════════════════════════
   SESSION CARDS
═══════════════════════════════════════════════════════════ */
.c-sessions {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 22px; margin-bottom: 2em;
}
@media (max-width: 900px) { .c-sessions { grid-template-columns: 1fr; } }

.c-session {
  background: #ffffff;
  border: 1px solid rgba(15,23,42,0.08);
  border-radius: var(--r);
  padding: 34px 30px;
  display: flex; flex-direction: column; gap: 16px;
  transition: transform .25s var(--ease), box-shadow .25s, border-color .25s;
  position: relative;
}
.c-session:hover {
  transform: translateY(-4px);
  box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(77,124,254,.25);
  border-color: rgba(77,124,254,.3);
}

/* Featured card — animated conic-gradient border */
.c-session--featured {
  background: var(--surface);
  /* Fallback border */
  border: 1px solid rgba(77,124,254,.5);
}
.c-session--featured::before {
  content: '';
  position: absolute; inset: -1px;
  border-radius: calc(var(--r) + 1px);
  background: conic-gradient(from var(--ba),
    transparent 0deg,
    var(--blue) 60deg,
    var(--purple) 120deg,
    var(--blue) 180deg,
    transparent 240deg
  );
  animation: spin-border 4s linear infinite;
  z-index: 0;
}
.c-session--featured > * { position: relative; z-index: 1; }
/* Inner background to cover the conic gradient body */
.c-session--featured::after {
  content: '';
  position: absolute; inset: 1px;
  background: var(--surface);
  border-radius: calc(var(--r) - 1px);
  z-index: 0;
}

.c-session__badge {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #fff !important;
  font-size: .67em; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 5px 16px; border-radius: 20px;
  white-space: nowrap; z-index: 2;
  box-shadow: 0 4px 16px rgba(77,124,254,.4);
}
.c-session__header {
  display: flex; justify-content: space-between;
  align-items: flex-start; gap: 8px;
}
.c-session h3 {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: 1.05em !important; font-weight: 700 !important;
  color: var(--text) !important; margin: 0 !important;
}
.c-session__price {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: 1.4em; font-weight: 800;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -.02em; flex-shrink: 0;
}
.c-session p { font-size: .88em; line-height: 1.72; color: var(--text-2); margin: 0; flex: 1; }
.c-session .c-service__list { border-top: 1px solid var(--border); padding-top: 1em; margin-top: 0; }
.c-session .c-btn { margin-top: auto; }

.c-booking-note {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px;
  background: rgba(77,124,254,.06);
  border: 1px solid rgba(77,124,254,.14);
  border-radius: 6px;
  font-size: .82em; color: var(--text-2);
}
.c-booking-note svg { flex-shrink: 0; color: var(--blue); opacity: .8; }

/* ═══════════════════════════════════════════════════════════
   BLOG / POST CARDS
═══════════════════════════════════════════════════════════ */
.c-posts {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
  margin-bottom: 2em;
}
@media (max-width: 900px) { .c-posts { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 560px) { .c-posts { grid-template-columns: 1fr; } }

.c-post {
  background: #ffffff;
  border: 1px solid rgba(15,23,42,0.08);
  padding: 32px 28px;
  text-decoration: none !important; color: inherit;
  display: flex; flex-direction: column; gap: 10px;
  transition: background .22s;
  position: relative; overflow: hidden;
}
.c-post::after {
  content: ''; position: absolute;
  bottom: 0; left: 0;
  height: 2px; width: 0;
  background: linear-gradient(90deg, var(--blue), var(--purple));
  transition: width .4s var(--ease);
}
.c-post:hover { background: var(--surface-2); text-decoration: none !important; }
.c-post:hover::after { width: 100%; }
.c-post__meta {
  display: flex; gap: 12px;
  font-size: .71em; color: var(--text-3); font-weight: 500;
}
.c-post__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: .95em !important; font-weight: 700 !important;
  letter-spacing: -.01em !important;
  color: var(--text) !important; line-height: 1.42 !important;
  margin: 0 !important;
  transition: color .2s !important;
}
.c-post:hover .c-post__title { color: var(--blue) !important; }
.c-post__excerpt { font-size: .84em; line-height: 1.65; color: var(--text-2); flex: 1; }
.c-post__cta {
  font-size: .78em; font-weight: 600; color: var(--blue);
  display: inline-flex; align-items: center; gap: 4px;
  transition: gap .2s var(--ease);
}
.c-post:hover .c-post__cta { gap: 8px; }

/* pagination */
.pagination { border-top: 1px solid var(--border) !important; }
.pagination--pager {
  font-family: 'Inter', sans-serif !important; font-size: .82em !important;
  font-weight: 500 !important;
  border: 1px solid var(--border-2) !important;
  background: var(--surface) !important;
  border-radius: 6px !important;
  color: var(--text-2) !important;
  transition: all .22s !important;
}
.pagination--pager:hover {
  border-color: rgba(77,124,254,.45) !important;
  color: var(--text) !important; background: var(--surface-2) !important;
}

/* ═══════════════════════════════════════════════════════════
   ABOUT
═══════════════════════════════════════════════════════════ */
.c-about {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 90px; align-items: start;
}
@media (max-width: 780px) { .c-about { grid-template-columns: 1fr; gap: 3em; } }
.c-about__text p {
  font-size: .97em; line-height: 1.88; color: var(--text-2); margin-bottom: 1.3em;
}
.c-about__text .c-section__title { margin-bottom: .4em !important; }
.c-about__text .c-btn { margin-top: .6em; }

.c-recog__title {
  font-size: .67em; font-weight: 600;
  letter-spacing: .2em; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 1.2em;
}
.c-recog-item {
  display: flex; flex-direction: column; gap: 4px;
  padding: 16px 0; border-bottom: 1px solid var(--border);
  transition: padding-left .25s var(--ease);
}
.c-recog-item:first-child { border-top: 1px solid var(--border); }
.c-recog-item:hover { padding-left: 8px; }
.c-recog__org {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: .9em; font-weight: 700; color: var(--text);
}
.c-recog__finding { font-size: .8em; color: var(--text-2); line-height: 1.5; }

/* ═══════════════════════════════════════════════════════════
   CONTACT CTA
═══════════════════════════════════════════════════════════ */
.c-cta {
  position: relative; padding: 130px 5%;
  text-align: center; overflow: hidden;
  background: #f8fafc;
  border-top: 1px solid rgba(15,23,42,0.06);
  z-index: 2;
}
.c-cta__blob {
  position: absolute;
  width: 800px; height: 800px;
  background: radial-gradient(circle, rgba(77,124,254,.1) 0%, rgba(167,139,250,.05) 40%, transparent 70%);
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  border-radius: 50%; filter: blur(60px); pointer-events: none;
  animation: blob3 12s ease-in-out infinite;
}
.c-cta__inner { position: relative; z-index: 2; max-width: 660px; margin: 0 auto; }
.c-cta__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: clamp(2em, 4vw, 3.2em) !important;
  font-weight: 800 !important; letter-spacing: -.03em !important;
  color: var(--text) !important;
  margin: 0 auto .8em !important; line-height: 1.12 !important;
}
.c-cta__sub {
  font-size: 1.02em; color: var(--text-2);
  margin: 0 auto 2.6em; line-height: 1.78; max-width: 480px;
}
.c-cta__actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

/* ═══════════════════════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════════════════════ */
.page__footer {
  background: rgba(3,3,10,0.95) !important;
  position: relative; z-index: 2;
  border-top: 1px solid var(--border) !important;
  font-family: 'Inter', sans-serif !important;
  font-size: .8em !important;
  color: var(--text-3) !important;
}
.page__footer a { color: var(--text-3) !important; }
.page__footer a:hover { color: var(--text-2) !important; }

/* ═══════════════════════════════════════════════════════════
   POST / SINGLE PAGE
═══════════════════════════════════════════════════════════ */
.page__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-weight: 800 !important; letter-spacing: -.025em !important;
  font-size: clamp(1.6em, 4vw, 2.4em) !important; line-height: 1.18 !important;
}
.page__content {
  font-family: 'Inter', sans-serif !important;
  font-size: 1em !important; line-height: 1.88 !important;
  color: rgba(237,237,245,.8) !important;
}
.page__content h2,.page__content h3,.page__content h4 {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-weight: 700 !important; letter-spacing: -.015em !important;
}
.page__content a { color: var(--blue) !important; }
.page__content a:hover { color: var(--blue-h) !important; }
:not(pre)>code {
  background: var(--surface) !important; color: #a5b4fc !important;
  border: 1px solid var(--border-2) !important;
  padding: .12em .38em !important; border-radius: 4px !important; font-size: .86em !important;
}
.highlight, pre.highlight, div.highlighter-rouge {
  border: 1px solid var(--border) !important; border-radius: 6px !important;
}
.author__name {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-weight: 700 !important; font-size: .95em !important; color: var(--text) !important;
}
.author__bio { color: var(--text-2) !important; font-size: .82em !important; }
.page__meta { color: var(--text-3) !important; font-size: .78em !important; }

/* ═══════════════════════════════════════════════════════════
   CERT BADGES
═══════════════════════════════════════════════════════════ */
.c-certs { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.c-certs__items { display: flex; gap: 10px; flex-wrap: wrap; }
.c-cert-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  font-size: .73em; font-weight: 600; letter-spacing: .04em;
  border-radius: 20px;
  border: 1px solid rgba(77,124,254,.35);
  background: rgba(77,124,254,.08);
  color: rgba(107,148,255,.9) !important;
  transition: border-color .2s, background .2s, transform .2s;
}
.c-cert-badge:hover {
  border-color: rgba(77,124,254,.65);
  background: rgba(77,124,254,.15);
  transform: translateY(-1px);
}
.c-cert-badge--purple {
  border-color: rgba(167,139,250,.35);
  background: rgba(167,139,250,.08);
  color: rgba(192,168,252,.9) !important;
}
.c-cert-badge--purple:hover {
  border-color: rgba(167,139,250,.65);
  background: rgba(167,139,250,.15);
}
.c-cert-badge svg { flex-shrink: 0; }

/* ═══════════════════════════════════════════════════════════
   MOBILE RESPONSIVE
═══════════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  /* Hero */
  .c-hero { padding: 110px 5% 70px; min-height: auto; }
  .c-hero__title { font-size: clamp(2.2em, 9vw, 3.2em) !important; }
  .c-hero__sub { font-size: 1em !important; }
  .c-hero__cta { flex-direction: column; gap: 10px; }
  .c-hero__cta .c-btn { width: 100%; justify-content: center; }
  .c-hero__blob--1 { width: 350px; height: 350px; }
  .c-hero__blob--2, .c-hero__blob--3 { display: none; }

  /* Metrics */
  .c-metrics { flex-wrap: wrap; }
  .c-metric { flex: 1 1 50%; border-right: none; border-bottom: 1px solid var(--border); }
  .c-metric:nth-child(odd) { border-right: 1px solid var(--border); }
  .c-metric:nth-last-child(-n+2) { border-bottom: none; }
  .c-metric__num { font-size: 2em; }

  /* Services */
  .c-services { grid-template-columns: 1fr; }
  .c-service { padding: 30px 24px; }

  /* Sessions */
  .c-sessions { grid-template-columns: 1fr; gap: 16px; }
  .c-session { padding: 28px 22px; }

  /* Posts */
  .c-posts { grid-template-columns: 1fr; }
  .c-post { padding: 24px 20px; }

  /* About */
  .c-about { grid-template-columns: 1fr; gap: 2.5em; }

  /* Sections */
  .c-section { padding: 70px 0; }
  .c-section__title { font-size: clamp(1.7em, 6vw, 2.2em) !important; }
  .c-section__head { margin-bottom: 2.5em; }

  /* CTA */
  .c-cta { padding: 80px 5%; }
  .c-cta__title { font-size: clamp(1.7em, 6vw, 2.2em) !important; }
  .c-cta__actions { flex-direction: column; align-items: center; }
  .c-cta__actions .c-btn { width: 100%; max-width: 340px; }

  /* Nav */
  .masthead__inner-wrap { padding: 0 4% !important; }

  /* Certs */
  .c-certs { flex-direction: column; align-items: flex-start; gap: 10px; }
}

@media (max-width: 480px) {
  .c-hero__title { font-size: clamp(1.9em, 10vw, 2.6em) !important; }
  .c-wrap { padding: 0 4%; }
  .c-service { padding: 24px 20px; }
  .c-metric { flex: 1 1 100%; border-right: none !important; }
  .c-metric:nth-last-child(-n+2) { border-bottom: 1px solid var(--border); }
  .c-metric:last-child { border-bottom: none; }
}

/* ═══════════════════════════════════════════════════════════
   ABOUT PILLARS
═══════════════════════════════════════════════════════════ */
.c-about__right { display: flex; flex-direction: column; justify-content: center; }
.c-about__pillars { display: flex; flex-direction: column; gap: 0; }
.c-pillar {
  display: flex; align-items: flex-start; gap: 18px;
  padding: 22px 0;
  border-bottom: 1px solid var(--border);
  transition: padding-left .25s var(--ease);
}
.c-pillar:first-child { border-top: 1px solid var(--border); }
.c-pillar:hover { padding-left: 6px; }
.c-pillar__icon {
  width: 38px; height: 38px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(77,124,254,.1);
  border: 1px solid rgba(77,124,254,.2);
  border-radius: 8px;
  color: var(--blue);
  transition: background .25s, border-color .25s, transform .25s var(--ease);
}
.c-pillar:hover .c-pillar__icon {
  background: rgba(77,124,254,.18);
  border-color: rgba(77,124,254,.4);
  transform: scale(1.05);
}
.c-pillar__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: .9em !important; font-weight: 700 !important;
  color: var(--text) !important; margin: 0 0 .3em !important;
}
.c-pillar__body {
  font-size: .82em; line-height: 1.65; color: var(--text-2); margin: 0;
}

/* ═══════════════════════════════════════════════════════════
   SCROLL REVEAL
═══════════════════════════════════════════════════════════ */
.c-reveal {
  opacity: 0; transform: translateY(24px);
  transition: opacity .65s var(--ease), transform .65s var(--ease);
}
.c-reveal.is-visible { opacity: 1; transform: translateY(0); }

/* ═══════════════════════════════════════════════════════════
   HERO TERMINAL WRAPPER — centered below CTAs
═══════════════════════════════════════════════════════════ */
.c-hero__term {
  margin: 36px auto 28px;
  width: 100%;
  max-width: 780px;
  position: relative;
  z-index: 4;
}
/* Soft teal light-bed behind the terminal — blends the dark window into the page */
.c-hero__term::before {
  content: '';
  position: absolute;
  inset: -80px -60px -40px -60px;
  background:
    radial-gradient(55% 60% at 50% 55%, rgba(13,148,136,0.22), transparent 72%),
    radial-gradient(32% 42% at 18% 100%, rgba(94,234,212,0.16), transparent 70%),
    radial-gradient(32% 42% at 82% 0%, rgba(13,148,136,0.13), transparent 72%);
  filter: blur(32px);
  z-index: 0;
  pointer-events: none;
}
.c-hero__term .c-term-window { position: relative; z-index: 1; }

/* ═══════════════════════════════════════════════════════════
   WORKSTATION SCENE — single monitor + silhouetted operator
═══════════════════════════════════════════════════════════ */
.c-workstation {
  position: relative;
  width: 100%;
  max-width: 880px;
  margin: 44px auto 20px;
  padding: 20px 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 4;
}
.c-workstation__center {
  position: relative;
  z-index: 2;
  width: 100%;
  margin: 0 auto;
}

/* Hacker silhouette — back-of-head + shoulders, rim-lit by the screen glow above */
.c-hacker {
  display: block;
  width: min(100%, 720px);
  height: auto;
  margin: -46px auto -6px;     /* overlap the monitor shadow, sell foreground depth */
  position: relative;
  z-index: 3;
  pointer-events: none;
  filter: drop-shadow(0 -14px 28px rgba(45,212,191,0.28));
}
@media (max-width: 640px) {
  .c-hacker { width: min(100%, 520px); margin: -30px auto -4px; }
  .c-workstation { max-width: 100%; padding: 14px 0 0; }
}

/* Respect motion preferences */
@media (prefers-reduced-motion: reduce) {
  .c-term-badge--rec .c-term-badge__pulse { animation: none !important; }
}

/* Allow hero to grow to fit content (was 100vh fixed) */
.c-hero {
  min-height: auto !important;
  padding: 130px 5% 80px !important;
}

/* ═══════════════════════════════════════════════════════════
   KALI TERMINAL WINDOW — the live engagement feed
═══════════════════════════════════════════════════════════ */
.c-term-window {
  background: #0a0e14;
  border: 1px solid #1e293b;
  border-radius: 12px;
  overflow: hidden;
  box-shadow:
    0 30px 70px rgba(13,148,136,.14),
    0 10px 28px rgba(15,23,42,.18),
    0 1px 3px rgba(15,23,42,.08);
  font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
  position: relative;
}
/* Soft teal glow ring */
.c-term-window::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 12px;
  padding: 1px;
  background: linear-gradient(135deg,
    rgba(13,148,136,0.45) 0%,
    rgba(15,23,42,0) 40%,
    rgba(15,23,42,0) 60%,
    rgba(6,182,212,0.45) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  pointer-events: none;
}

/* Hero variant */
.c-term-window--hero { width: 100%; }
.c-term-window--hero .c-term-window__split {
  display: flex;
  height: 440px;
  position: relative;
}
.c-term-window--hero .c-term-window__body {
  flex: 1 1 62%;
  height: 100%;
  padding: 26px 22px 20px;
  font-size: .80em;
  overflow-y: auto;
  scrollbar-width: none;          /* Firefox: hide scrollbar */
  border-right: 1px solid rgba(13,148,136,0.14);
  /* Graceful fade of older lines as new ones scroll in */
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 42px, #000 calc(100% - 6px), transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 42px, #000 calc(100% - 6px), transparent 100%);
  transition: opacity .3s ease;
}
.c-term-window--hero .c-term-window__body.is-resetting { opacity: 0; }
.c-term-window--hero .c-term-window__body::-webkit-scrollbar { display: none; }

/* Operator notes side panel — lives inside the terminal as the right column of the split */
.c-term-notes {
  flex: 0 0 38%;
  height: 100%;
  background: #070b11;
  padding: 14px 14px 16px;
  font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
  font-size: .62em;
  line-height: 1.55;
  color: #94a3b8;
  overflow-y: auto;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 38px, #000 calc(100% - 6px), transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 38px, #000 calc(100% - 6px), transparent 100%);
}
.c-term-notes::-webkit-scrollbar { display: none; }
.c-term-notes__head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 9px;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(13,148,136,0.14);
  color: #475569;
  font-size: 1em;
  font-weight: 600;
  letter-spacing: .1em;
}
.c-term-notes__title { color: #475569; }
.c-term-notes__count {
  color: #5eead4;
  background: rgba(13,148,136,0.1);
  padding: 2px 7px;
  border-radius: 3px;
  font-size: .92em;
  min-width: 20px;
  text-align: center;
}
.c-term-notes__item {
  display: block;
  margin-bottom: 7px;
  word-break: break-word;
  opacity: 0;
  transform: translateY(4px);
  animation: term-note-in .35s ease forwards;
}
@keyframes term-note-in {
  to { opacity: 1; transform: translateY(0); }
}
.c-term-notes__time {
  color: #475569;
  margin-right: 8px;
  letter-spacing: .02em;
}
.c-term-notes__text { color: #cbd5e1; }
.c-term-notes__text--flag { color: #fbbf24; font-weight: 600; }
.c-term-notes__text--ok   { color: #5eead4; font-weight: 600; }
.c-term-notes__text--hot  { color: #f87171; font-weight: 600; }

/* tmux-style status line pinned to bottom of the terminal window */
.c-term-window__status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 5px 16px;
  background: linear-gradient(180deg, #0a0e14 0%, #05080c 100%);
  border-top: 1px solid rgba(13,148,136,0.22);
  font-family: 'JetBrains Mono', 'SF Mono', monospace;
  font-size: .56em;
  color: #94a3b8;
  letter-spacing: .08em;
  white-space: nowrap;
  overflow: hidden;
}
.c-term-status__lhs, .c-term-status__rhs {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.c-term-status__sigil { color: #334155; }
.c-term-status__host { color: #2dd4bf; font-weight: 600; }
.c-term-status__arrow { color: #475569; margin: 0 2px; }
.c-term-status__target { color: #5eead4; font-weight: 600; }
.c-term-status__dim { color: #64748b; }
.c-term-status__sep { color: #334155; }

/* Pause / play control in the chrome — accessibility + confidence */
.c-term-ctrl {
  appearance: none;
  background: transparent;
  border: 1px solid rgba(100,116,139,0.22);
  color: #94a3b8;
  width: 22px; height: 22px;
  border-radius: 3px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: color .2s ease, border-color .2s ease, background .2s ease;
  padding: 0;
}
.c-term-ctrl:hover {
  color: #5eead4;
  border-color: rgba(13,148,136,0.4);
  background: rgba(13,148,136,0.06);
}
.c-term-ctrl:focus-visible {
  outline: 2px solid rgba(13,148,136,0.5);
  outline-offset: 2px;
}
.c-term-ctrl .c-term-ctrl__icon--play { display: none; }
.c-term-ctrl.is-paused .c-term-ctrl__icon--pause { display: none; }
.c-term-ctrl.is-paused .c-term-ctrl__icon--play  { display: inline-block; }
.c-term-ctrl.is-paused {
  color: #2dd4bf;
  border-color: rgba(13,148,136,0.4);
  background: rgba(13,148,136,0.08);
}

/* Responsive — hide notes + status-line right side on narrow screens */
@media (max-width: 720px) {
  .c-term-window--hero .c-term-window__split {
    display: block;
    height: auto;
  }
  .c-term-window--hero .c-term-window__body {
    flex: 1 1 auto;
    height: 280px;
    border-right: none;
  }
  .c-term-notes { display: none; }
}
@media (max-width: 640px) {
  .c-term-window__status { font-size: .5em; padding: 4px 10px; gap: 6px; letter-spacing: .05em; }
  .c-term-status__rhs { display: none; }
}
@media (max-width: 640px) {
  .c-term-window--hero .c-term-window__body {
    height: 280px;
    font-size: .68em;
    padding: 12px 14px 16px;
  }
}

/* Operational chrome bar — replaces generic macOS traffic dots with REC / VPN / session */
.c-term-window__chrome {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
  border-bottom: 1px solid #1e293b;
  user-select: none;
}
.c-term-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
  font-size: .62em;
  font-weight: 600;
  letter-spacing: .08em;
  line-height: 1;
  white-space: nowrap;
}
.c-term-badge--rec {
  color: #fca5a5;
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.22);
}
.c-term-badge--rec .c-term-badge__pulse {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #ef4444;
  box-shadow: 0 0 6px rgba(239,68,68,0.7);
  animation: term-rec-pulse 1.6s ease-in-out infinite;
}
@keyframes term-rec-pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%     { opacity: .35; transform: scale(.7); }
}
.c-term-badge--vpn {
  color: #5eead4;
  background: rgba(13,148,136,0.09);
  border: 1px solid rgba(13,148,136,0.26);
}
.c-term-badge--vpn .c-term-badge__glyph {
  font-size: 1em;
  line-height: 1;
  color: #14b8a6;
}
.c-term-window__title {
  font-size: .76em;
  color: #cbd5e1;
  flex: 1;
  text-align: center;
  letter-spacing: -.005em;
  font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
  font-weight: 500;
}
.c-term-session {
  font-family: 'JetBrains Mono', 'SF Mono', monospace;
  font-size: .64em;
  color: #64748b;
  letter-spacing: .06em;
  white-space: nowrap;
}
.c-term-replay {
  font-family: 'JetBrains Mono', 'SF Mono', monospace;
  font-size: .58em;
  font-weight: 600;
  letter-spacing: .12em;
  color: #64748b;
  white-space: nowrap;
  padding: 3px 8px;
  border: 1px solid rgba(100,116,139,0.22);
  border-radius: 3px;
  background: rgba(15,23,42,0.45);
  cursor: help;
  transition: color .2s ease, border-color .2s ease;
}
.c-term-replay:hover { color: #94a3b8; border-color: rgba(148,163,184,0.35); }

/* Objective strip — TARGET / OBJECTIVE / T+clock / PHASE */
.c-term-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 9px 18px;
  background:
    linear-gradient(180deg, rgba(13,148,136,0.06) 0%, rgba(13,148,136,0.02) 100%);
  border-bottom: 1px solid rgba(13,148,136,0.16);
  font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
  font-size: .62em;
  letter-spacing: .07em;
  line-height: 1.2;
  color: #64748b;
}
.c-term-strip__item {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  white-space: nowrap;
}
.c-term-strip__k {
  color: #475569;
  text-transform: uppercase;
  font-weight: 600;
  font-size: .9em;
}
.c-term-strip__v {
  color: #5eead4;
  font-weight: 500;
}
.c-term-strip__v--phase {
  color: #2dd4bf;
  text-transform: uppercase;
  letter-spacing: .1em;
  transition: color .3s ease;
}
.c-term-strip__sep { color: #1e293b; }
@media (max-width: 640px) {
  .c-term-strip { gap: 8px; padding: 7px 12px; font-size: .54em; letter-spacing: .05em; }
  .c-term-strip__sep { display: none; }
  .c-term-replay { font-size: .52em; padding: 2px 6px; letter-spacing: .08em; }
}
.c-term-window__meta {
  font-size: .72em;
  color: #64748b;
  letter-spacing: .02em;
}
@media (max-width: 640px) {
  .c-term-window__chrome { padding: 8px 12px; gap: 6px; }
  .c-term-window__meta { display: none; }
  .c-term-session { display: none; }
  .c-term-window__title { font-size: .64em; text-align: right; letter-spacing: -.01em; }
  .c-term-badge { font-size: .56em; padding: 2px 7px; letter-spacing: .05em; }
}

/* Terminal body */
.c-term-window__body {
  background: #0a0e14;
  padding: 22px 26px 28px;
  font-size: .82em;
  line-height: 1.65;
  color: #cbd5e1;
  position: relative;
  letter-spacing: -.005em;
  overflow-y: auto;
  scrollbar-width: none;
}
.c-term-window__body::-webkit-scrollbar { display: none; }
@media (max-width: 640px) {
  .c-term-window__body { font-size: .72em; padding: 18px 18px 22px; min-height: 380px; max-height: 460px; }
}

/* Terminal text tokens — informational = brand teal/slate family, operational = green/yellow/red */
.tl-line { display: block; white-space: pre-wrap; word-break: break-word; }
/* Prompt — brand teal family */
.tl-prompt-host  { color: #2dd4bf; font-weight: 600; }
.tl-prompt-at    { color: #64748b; }
.tl-prompt-tilde { color: #94a3b8; }
.tl-prompt-arrow { color: #5eead4; font-weight: 600; }
.tl-prompt-dollar{ color: #10b981; font-weight: 700; margin-right: 4px; }
/* Command body — neutral slate */
.tl-cmd          { color: #e2e8f0; }
.tl-flag         { color: #cbd5e1; }
.tl-str          { color: #94a3b8; }
.tl-num          { color: #cbd5e1; }
.tl-dim          { color: #64748b; }
.tl-domain       { color: #94a3b8; }
.tl-user         { color: #a7f3d0; }
.tl-hi           { color: #5eead4; }
.tl-banner       { color: #2dd4bf; font-weight: 700; }
/* Operational semantics — only these carry traffic-light meaning */
.tl-ok           { color: #10b981; font-weight: 600; }
.tl-warn         { color: #fbbf24; }
.tl-err          { color: #ef4444; font-weight: 600; }
.tl-pass         { color: #fbbf24; font-weight: 700; }

/* Blinking cursor while typing */
.tl-cursor {
  display: inline-block;
  width: 8px; height: 1.1em;
  background: #10b981;
  vertical-align: text-bottom;
  margin-left: 2px;
  animation: term-cursor-blink 1s step-end infinite;
}
@keyframes term-cursor-blink {
  0%,50%  { opacity: 1; }
  51%,100%{ opacity: 0; }
}

/* Subtle scanline overlay for retro CRT feel (very low opacity, optional) */
.c-term-window__body::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg,
    transparent 0, transparent 3px,
    rgba(16,185,129,.018) 3px, rgba(16,185,129,.018) 4px);
  pointer-events: none;
  mix-blend-mode: screen;
}

/* Demo footnote */
.c-live-demo__footnote {
  max-width: 760px;
  margin: 24px auto 0;
  padding: 14px 20px;
  font-family: 'JetBrains Mono', 'SF Mono', monospace;
  font-size: .78em;
  line-height: 1.7;
  color: #64748b;
  text-align: center;
  letter-spacing: -.005em;
}
.c-term-note-mark { color: #0d9488; font-weight: 700; margin-right: 6px; }

/* ═══════════════════════════════════════════════════════════
   TERMINAL STATUS TICKER (classy offensive accent)
═══════════════════════════════════════════════════════════ */
.c-terminal {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 20px 0 36px;
  padding: 10px 18px;
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 8px;
  font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
  font-size: .78em;
  letter-spacing: -.005em;
  max-width: 100%;
  box-shadow: 0 4px 20px rgba(15,23,42,.12);
}
.c-terminal__prompt { color: #0d9488; font-weight: 700; }
.c-terminal__key { color: #94a3b8; }
.c-terminal__sep { color: #475569; }
.c-terminal__val { color: #e2e8f0; }
.c-terminal__val--accent {
  color: #10b981;
  font-weight: 600;
  position: relative;
  padding-left: 14px;
}
.c-terminal__val--accent::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  width: 6px; height: 6px;
  margin-top: -3px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 0 rgba(16,185,129,.5);
  animation: pm-pulse 1.5s ease-in-out infinite;
}
.c-terminal__dot { color: #475569; margin: 0 2px; }
.c-terminal__cursor {
  display: inline-block;
  color: #0d9488;
  font-weight: 700;
  margin-left: 4px;
  animation: terminal-blink 1.1s step-end infinite;
}
@keyframes terminal-blink {
  0%,50%  { opacity: 1; }
  51%,100%{ opacity: 0; }
}
@media (max-width: 640px) {
  .c-terminal { font-size: .72em; padding: 9px 14px; }
}

/* ═══════════════════════════════════════════════════════════
   MONOSPACE CALLOUT (subtle red-team texture)
═══════════════════════════════════════════════════════════ */
.c-mono-callout {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 18px 22px;
  margin: 24px 0;
  background: #f8fafc;
  border-left: 3px solid #0d9488;
  border-radius: 0 10px 10px 0;
  font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
  font-size: .92em;
  line-height: 1.7;
  color: #334155;
  letter-spacing: -.005em;
}
.c-mono-callout__prefix {
  color: #0d9488;
  font-weight: 700;
  flex-shrink: 0;
  user-select: none;
}

/* ═══════════════════════════════════════════════════════════
   ANIMATIONS — site-wide motion
═══════════════════════════════════════════════════════════ */

/* Animated gradient on hero title accent word */
.c-grad {
  background: linear-gradient(90deg, #0d9488 0%, #14b8a6 25%, #06b6d4 50%, #14b8a6 75%, #0d9488 100%) !important;
  background-size: 200% 100% !important;
  -webkit-background-clip: text !important;
  -webkit-text-fill-color: transparent !important;
  background-clip: text !important;
  animation: gradient-shift 6s ease-in-out infinite !important;
}
@keyframes gradient-shift {
  0%,100% { background-position: 0% 50%; }
  50%     { background-position: 100% 50%; }
}

/* Pulse ring around active process node */
.c-timeline__step.is-active .c-timeline__node::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px solid #0d9488;
  opacity: 0;
  animation: node-pulse 2s ease-out infinite;
}
.c-timeline__step.is-active .c-timeline__node { position: relative; }
@keyframes node-pulse {
  0%   { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(1.5); opacity: 0; }
}

/* Floating particles in hero */
.c-hero__particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.c-particle {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #0d9488;
  opacity: .4;
  animation: particle-float 18s ease-in-out infinite;
}
.c-particle:nth-child(1) { top: 15%; left: 8%;  width: 4px; height: 4px; animation-delay: 0s;   animation-duration: 14s; }
.c-particle:nth-child(2) { top: 30%; left: 85%; width: 8px; height: 8px; background: #06b6d4; animation-delay: 2s;  animation-duration: 18s; }
.c-particle:nth-child(3) { top: 70%; left: 12%; width: 5px; height: 5px; background: #14b8a6; animation-delay: 4s;  animation-duration: 16s; }
.c-particle:nth-child(4) { top: 55%; left: 78%; width: 6px; height: 6px; animation-delay: 1s;  animation-duration: 20s; }
.c-particle:nth-child(5) { top: 20%; left: 50%; width: 4px; height: 4px; background: #06b6d4; animation-delay: 3s;  animation-duration: 15s; }
.c-particle:nth-child(6) { top: 85%; left: 35%; width: 7px; height: 7px; background: #14b8a6; animation-delay: 5s;  animation-duration: 17s; }
.c-particle:nth-child(7) { top: 40%; left: 22%; width: 3px; height: 3px; animation-delay: 6s;  animation-duration: 13s; }
.c-particle:nth-child(8) { top: 65%; left: 55%; width: 5px; height: 5px; background: #06b6d4; animation-delay: 2.5s; animation-duration: 19s; }
@keyframes particle-float {
  0%,100% { transform: translate(0,0); opacity: .4; }
  25%     { transform: translate(30px,-20px); opacity: .7; }
  50%     { transform: translate(-15px,-40px); opacity: .3; }
  75%     { transform: translate(20px,-10px); opacity: .6; }
}

/* Section-level drifting background blobs (added to services, cta, faq) */
.c-section, .c-cta {
  position: relative;
  overflow: hidden;
}
.c-section::before, .c-cta::before {
  content: '';
  position: absolute;
  top: -15%; right: -8%;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(13,148,136,0.08) 0%, rgba(13,148,136,0) 70%);
  filter: blur(40px);
  animation: section-blob 22s ease-in-out infinite;
  z-index: 0;
  pointer-events: none;
}
.c-section--alt::before {
  background: radial-gradient(circle, rgba(6,182,212,0.10) 0%, rgba(6,182,212,0) 70%);
  right: auto; left: -8%;
  animation-direction: reverse;
  animation-duration: 25s;
}
.c-section > .c-wrap, .c-cta > .c-wrap { position: relative; z-index: 1; }
@keyframes section-blob {
  0%,100% { transform: translate(0,0) scale(1); }
  33%     { transform: translate(-60px,50px) scale(1.1); }
  66%     { transform: translate(40px,-30px) scale(.95); }
}

/* Stagger service card entrance */
.c-services .c-service { animation: card-rise .6s cubic-bezier(.22,.61,.36,1) backwards; }
.c-services .c-service:nth-child(1) { animation-delay: .05s; }
.c-services .c-service:nth-child(2) { animation-delay: .15s; }
.c-services .c-service:nth-child(3) { animation-delay: .25s; }
.c-services .c-service:nth-child(4) { animation-delay: .35s; }
@keyframes card-rise {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Service icon subtle float on hover */
.c-service:hover .c-service__icon {
  animation: icon-bob 1.2s ease-in-out infinite;
}
@keyframes icon-bob {
  0%,100% { transform: translateY(0) scale(1.1); }
  50%     { transform: translateY(-6px) scale(1.15); }
}

/* Animated conic border on featured stat card */
.c-stat-card--featured {
  position: relative;
  isolation: isolate;
}
.c-stat-card--featured::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 16px;
  padding: 2px;
  background: conic-gradient(from 0deg, #0d9488, #06b6d4, #14b8a6, #5eead4, #0d9488);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  animation: conic-spin 6s linear infinite;
  z-index: -1;
}
@keyframes conic-spin {
  to { transform: rotate(360deg); }
}

/* Button shimmer */
.c-btn--primary {
  position: relative;
  overflow: hidden;
}
.c-btn--primary::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
  animation: btn-shimmer 3s ease-in-out infinite;
}
@keyframes btn-shimmer {
  0%    { left: -100%; }
  50%   { left: 100%; }
  100%  { left: 100%; }
}

/* Scroll-indicator chevron bounce (bottom of hero) */
.c-scroll-cue {
  position: absolute;
  bottom: 40px; left: 50%;
  transform: translateX(-50%);
  width: 32px; height: 32px;
  color: #0d9488;
  opacity: .7;
  animation: scroll-bounce 2s ease-in-out infinite;
  z-index: 3;
}
@keyframes scroll-bounce {
  0%,100% { transform: translate(-50%, 0); opacity: .7; }
  50%     { transform: translate(-50%, 8px); opacity: 1; }
}

/* Chip bounce on hover (hall-of-fame chips) */
.c-chip { transition: transform .2s ease, background .2s ease, color .2s ease; }
.c-chip:hover {
  transform: translateY(-3px) scale(1.05);
  background: #0d9488;
  color: #ffffff;
}

/* Animated pulsing dot on c-label eyebrow */
.c-label::before { animation: label-pulse 2s ease-in-out infinite !important; }
@keyframes label-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(13,148,136,.5); transform: scale(1); }
  50%     { box-shadow: 0 0 0 8px rgba(13,148,136,0); transform: scale(1.2); }
}

/* ═══════════════════════════════════════════════════════════
   OPERATOR / PRINCIPAL BIO
═══════════════════════════════════════════════════════════ */
.c-operator {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 80px;
  align-items: start;
  max-width: 1120px;
  margin: 0 auto;
}
@media (max-width: 960px) {
  .c-operator { grid-template-columns: 1fr; gap: 56px; }
}

.c-operator__lead .c-section__title {
  font-size: clamp(2.4em, 5vw, 3.4em) !important;
  margin-bottom: .3em !important;
}

.c-operator__role {
  font-family: 'Inter', sans-serif;
  font-size: 1.02em;
  font-weight: 500;
  color: #0d9488;
  margin: 0 0 1.6em;
  line-height: 1.5;
  letter-spacing: -.005em;
}

.c-operator__bio {
  font-size: 1em;
  line-height: 1.78;
  color: #475569;
  margin: 0 0 1.2em;
}

.c-operator__ctas {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 1.8em;
}

/* Stat cards grid */
.c-operator__stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.c-stat-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 24px;
  transition: border-color .25s ease, transform .25s ease, box-shadow .25s ease;
}
.c-stat-card:hover {
  border-color: #0d9488;
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(13,148,136,.1);
}

.c-stat-card--featured {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, #f0fdfa 0%, #ffffff 80%);
  border-color: #5eead4;
}

.c-stat-card__label {
  font-family: 'Inter', sans-serif;
  font-size: .72em;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #64748b;
  margin-bottom: 12px;
}

.c-stat-card__value {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 1.9em;
  font-weight: 800;
  letter-spacing: -.03em;
  color: #0f172a;
  line-height: 1.1;
  margin-bottom: 8px;
}
.c-stat-card__suffix {
  font-size: .7em;
  color: #0d9488;
  margin-left: 2px;
}

.c-stat-card__note {
  font-family: 'Inter', sans-serif;
  font-size: .84em;
  color: #64748b;
  line-height: 1.5;
}

/* Cert badges */
.c-stat-card__badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.c-stat-badge {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  background: #0f172a;
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  font-size: .78em;
  font-weight: 700;
  letter-spacing: .04em;
  border-radius: 6px;
}

/* Hall of Fame chips */
.c-stat-card__chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.c-chip {
  display: inline-flex;
  align-items: center;
  padding: 8px 14px;
  background: #ffffff;
  color: #0d9488;
  border: 1px solid #5eead4;
  font-family: 'Inter', sans-serif;
  font-size: .82em;
  font-weight: 700;
  letter-spacing: .02em;
  border-radius: 999px;
}

/* ═══════════════════════════════════════════════════════════
   FAQ — accordion (details/summary)
═══════════════════════════════════════════════════════════ */
.c-faq {
  max-width: 840px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.c-faq__item {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  overflow: hidden;
  transition: border-color .25s ease, box-shadow .25s ease;
}
.c-faq__item[open] {
  border-color: #0d9488;
  box-shadow: 0 10px 30px rgba(13,148,136,.06);
}
.c-faq__item:hover { border-color: #94a3b8; }
.c-faq__item[open]:hover { border-color: #0d9488; }

.c-faq__q {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 28px;
  font-family: 'Inter', sans-serif;
  font-size: 1.02em;
  font-weight: 600;
  color: #0f172a;
  cursor: pointer;
  list-style: none;
  transition: color .2s ease;
  letter-spacing: -.005em;
}
.c-faq__q::-webkit-details-marker { display: none; }
.c-faq__q:hover { color: #0d9488; }
.c-faq__item[open] .c-faq__q { color: #0d9488; }

.c-faq__icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  color: #94a3b8;
  transition: transform .3s cubic-bezier(.22,.61,.36,1), color .2s ease;
}
.c-faq__item[open] .c-faq__icon {
  transform: rotate(180deg);
  color: #0d9488;
}

.c-faq__a {
  padding: 0 28px 26px;
  animation: faq-slide-down .35s cubic-bezier(.22,.61,.36,1);
}
.c-faq__a p {
  font-family: 'Inter', sans-serif;
  font-size: .96em;
  line-height: 1.78;
  color: #475569;
  margin: 0;
}
.c-faq__a p + p { margin-top: 1em; }
.c-faq__a strong { color: #0f172a; font-weight: 600; }
.c-faq__a em { color: #0d9488; font-style: normal; font-weight: 500; }

@keyframes faq-slide-down {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .c-faq__q { padding: 18px 20px; font-size: .96em; }
  .c-faq__a { padding: 0 20px 22px; }
}
