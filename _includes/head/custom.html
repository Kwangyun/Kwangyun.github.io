<!-- Consulting firm aesthetic — Kwang Security -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   BASE
═══════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
html { cursor: none; scroll-behavior: smooth; }

body {
  font-family: 'Inter', system-ui, sans-serif !important;
  background: #080808 !important;
  color: #d4d4d4 !important;
}

/* monospace only where it matters */
code, pre, .masthead .site-title, .hk-eyebrow, .hk-section__label,
.hk-metric__label, .hk-badge, .hk-post-card__meta, .hk-hof-detail,
.page__meta, .author__bio {
  font-family: 'Share Tech Mono', monospace !important;
}

h1, h2, h3, h4, h5, h6,
.hk-hero__title, .hk-section__title, .hk-service-card h3,
.hk-post-card__title, .site-title, .author__name {
  font-family: 'Orbitron', monospace !important;
}

/* ═══════════════════════════════════════════════════════════════════════
   CUSTOM CURSOR
═══════════════════════════════════════════════════════════════════════ */
#hk-cursor-dot {
  position: fixed; width: 7px; height: 7px;
  background: #00ff41; border-radius: 50%;
  pointer-events: none; z-index: 99999;
  box-shadow: 0 0 8px #00ff41, 0 0 18px rgba(0,255,65,0.5);
}
#hk-cursor-ring {
  position: fixed; width: 30px; height: 30px;
  border: 1.5px solid rgba(0,255,65,0.5); border-radius: 50%;
  pointer-events: none; z-index: 99998;
  transition: width .2s, height .2s, border-color .2s;
}
#hk-cursor-ring.hk-cursor-hover {
  width: 50px; height: 50px; border-color: #00ff41;
  box-shadow: 0 0 14px rgba(0,255,65,0.3);
}

/* ═══════════════════════════════════════════════════════════════════════
   MATRIX CANVAS + SCANLINES
═══════════════════════════════════════════════════════════════════════ */
#hk-matrix {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none; opacity: 1;
}
#hk-scanlines {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
  );
  pointer-events: none; z-index: 9999;
}

/* ═══════════════════════════════════════════════════════════════════════
   PAGE LAYERS
═══════════════════════════════════════════════════════════════════════ */
.masthead, #main, .page__footer, .hk-hero,
.hk-metrics, .hk-section { position: relative; z-index: 10; }

/* ═══════════════════════════════════════════════════════════════════════
   MASTHEAD
═══════════════════════════════════════════════════════════════════════ */
.masthead {
  background: rgba(8,8,8,0.92) !important;
  backdrop-filter: blur(14px) !important;
  -webkit-backdrop-filter: blur(14px) !important;
  border-bottom: 1px solid rgba(0,255,65,0.15) !important;
  box-shadow: 0 1px 0 rgba(0,255,65,0.06), 0 4px 30px rgba(0,0,0,0.6) !important;
}
.site-title {
  font-weight: 900 !important;
  letter-spacing: 0.12em !important;
  text-transform: uppercase !important;
  color: #00ff41 !important;
  position: relative !important;
  font-size: 1em !important;
}
.site-title::after {
  content: '█';
  animation: hk-blink 1s step-end infinite;
  margin-left: 4px; font-size: 0.65em; opacity: 0.85;
  font-family: monospace !important;
}
.site-title.glitching::before, .site-title.glitching::after {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
}
.site-title.glitching::before {
  content: attr(data-text);
  animation: hk-glitch1 .18s steps(1) forwards; color: #00ffff;
}
.site-title.glitching::after {
  content: attr(data-text);
  animation: hk-glitch2 .18s steps(1) forwards;
}
.greedy-nav a, .masthead__menu-item a {
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 0.78em !important;
  letter-spacing: 0.1em !important;
  text-transform: uppercase !important;
  color: rgba(212,212,212,0.7) !important;
  transition: color .2s, text-shadow .2s !important;
}
.greedy-nav a:hover, .masthead__menu-item a:hover {
  color: #00ff41 !important;
  text-shadow: 0 0 10px rgba(0,255,65,0.6) !important;
}

/* ═══════════════════════════════════════════════════════════════════════
   HERO
═══════════════════════════════════════════════════════════════════════ */
.hk-hero {
  min-height: 88vh;
  display: flex; align-items: center;
  padding: 120px 5% 80px;
  background: linear-gradient(135deg, rgba(0,255,65,0.03) 0%, transparent 60%);
  border-bottom: 1px solid rgba(0,255,65,0.1);
}
.hk-hero__inner { max-width: 780px; }
.hk-eyebrow {
  font-size: 0.72em; letter-spacing: 0.22em;
  text-transform: uppercase; color: #00ff41;
  margin-bottom: 1.2em; opacity: 0.8;
}
.hk-hero__title {
  font-size: clamp(2.4em, 6vw, 4.2em) !important;
  font-weight: 900 !important;
  line-height: 1.08 !important;
  letter-spacing: 0.04em !important;
  color: #f0f0f0 !important;
  margin: 0 0 0.6em !important;
}
.hk-green { color: #00ff41; text-shadow: 0 0 30px rgba(0,255,65,0.4); }
.hk-hero__sub {
  font-family: 'Inter', sans-serif !important;
  font-size: 1.05em; line-height: 1.75;
  color: rgba(212,212,212,0.65);
  max-width: 580px; margin-bottom: 2.2em;
}
.hk-hero__cta { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 2.4em; }

/* buttons */
.hk-btn {
  display: inline-block;
  padding: 12px 28px;
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 0.82em; letter-spacing: 0.1em; text-transform: uppercase;
  text-decoration: none !important;
  border-radius: 2px; transition: all .22s; cursor: none;
}
.hk-btn--primary {
  background: #00ff41; color: #080808 !important;
  font-weight: 700;
  box-shadow: 0 0 20px rgba(0,255,65,0.35);
}
.hk-btn--primary:hover {
  background: #00cc35;
  box-shadow: 0 0 35px rgba(0,255,65,0.55);
  transform: translateY(-1px);
  text-shadow: none !important;
}
.hk-btn--ghost {
  border: 1px solid rgba(0,255,65,0.45);
  color: #00ff41 !important;
  background: transparent;
}
.hk-btn--ghost:hover {
  background: rgba(0,255,65,0.08);
  border-color: #00ff41;
  box-shadow: 0 0 18px rgba(0,255,65,0.2);
  transform: translateY(-1px);
  text-shadow: none !important;
}

/* recognition badges */
.hk-hero__badges { display: flex; gap: 10px; flex-wrap: wrap; }
.hk-badge {
  font-size: 0.68em; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 5px 12px;
  border: 1px solid rgba(0,255,65,0.25);
  border-radius: 2px;
  color: rgba(0,255,65,0.65);
  background: rgba(0,255,65,0.04);
}

/* ═══════════════════════════════════════════════════════════════════════
   METRICS BAR
═══════════════════════════════════════════════════════════════════════ */
.hk-metrics {
  display: flex;
  border-top: 1px solid rgba(0,255,65,0.1);
  border-bottom: 1px solid rgba(0,255,65,0.1);
  background: rgba(0,0,0,0.4);
}
.hk-metric {
  flex: 1; text-align: center; padding: 28px 16px;
  border-right: 1px solid rgba(0,255,65,0.08);
  transition: background .2s;
}
.hk-metric:last-child { border-right: none; }
.hk-metric:hover { background: rgba(0,255,65,0.04); }
.hk-metric__num {
  display: block;
  font-family: 'Orbitron', monospace !important;
  font-size: 2em; font-weight: 900;
  color: #00ff41;
  text-shadow: 0 0 16px rgba(0,255,65,0.6);
  line-height: 1; margin-bottom: 8px;
}
.hk-metric__label {
  display: block; font-size: 0.66em;
  color: rgba(212,212,212,0.4);
  letter-spacing: 0.12em; text-transform: uppercase;
}

/* ═══════════════════════════════════════════════════════════════════════
   SECTIONS
═══════════════════════════════════════════════════════════════════════ */
.hk-section {
  padding: 90px 5%;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  max-width: 1100px;
  margin: 0 auto;
}
.hk-section__label {
  font-size: 0.68em; letter-spacing: 0.22em;
  text-transform: uppercase; color: #00ff41;
  opacity: 0.7; margin-bottom: 0.6em;
}
.hk-section__title {
  font-size: clamp(1.5em, 3.5vw, 2.4em) !important;
  font-weight: 900 !important;
  letter-spacing: 0.06em !important;
  color: #f0f0f0 !important;
  margin: 0 0 2.2em !important;
  padding-bottom: 0.5em !important;
  border-bottom: 1px solid rgba(0,255,65,0.18) !important;
}

/* ═══════════════════════════════════════════════════════════════════════
   SERVICES
═══════════════════════════════════════════════════════════════════════ */
.hk-services {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5px;
  background: rgba(0,255,65,0.08);
  border: 1px solid rgba(0,255,65,0.12);
  border-radius: 4px;
  overflow: hidden;
}
.hk-service-card {
  background: #0c0c0c;
  padding: 36px 30px;
  transition: background .22s;
  position: relative;
  overflow: hidden;
}
.hk-service-card::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 3px; height: 0;
  background: #00ff41;
  transition: height .3s ease;
}
.hk-service-card:hover { background: #101010; }
.hk-service-card:hover::before { height: 100%; }
.hk-service-card__icon {
  width: 36px; height: 36px;
  color: #00ff41; margin-bottom: 1.2em;
  opacity: 0.85;
}
.hk-service-card h3 {
  font-size: 0.88em !important;
  font-weight: 600 !important;
  letter-spacing: 0.08em !important;
  text-transform: uppercase !important;
  color: #f0f0f0 !important;
  margin: 0 0 0.9em !important;
}
.hk-service-card p {
  font-family: 'Inter', sans-serif !important;
  font-size: 0.88em; line-height: 1.7;
  color: rgba(212,212,212,0.6);
  margin-bottom: 1.2em;
}
.hk-service-card ul {
  list-style: none; padding: 0; margin: 0;
}
.hk-service-card ul li {
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 0.78em; color: rgba(0,255,65,0.6);
  padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.04);
}
.hk-service-card ul li::before { content: '→ '; opacity: 0.6; }

/* ═══════════════════════════════════════════════════════════════════════
   ABOUT
═══════════════════════════════════════════════════════════════════════ */
.hk-about__grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4em;
  align-items: start;
}
@media (max-width: 680px) { .hk-about__grid { grid-template-columns: 1fr; gap: 2em; } }
.hk-about__text p {
  font-family: 'Inter', sans-serif !important;
  font-size: 0.95em; line-height: 1.8;
  color: rgba(212,212,212,0.65);
  margin-bottom: 1.2em;
}
.hk-about__text .hk-btn { margin-top: 0.5em; }
.hk-about__hof-title {
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 0.68em; letter-spacing: 0.2em;
  text-transform: uppercase; color: rgba(0,255,65,0.6);
  margin-bottom: 1em;
}
.hk-hof-item {
  display: flex; flex-direction: column;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.hk-hof-org {
  font-family: 'Orbitron', monospace !important;
  font-size: 0.78em; font-weight: 600;
  color: #f0f0f0; letter-spacing: 0.06em;
  margin-bottom: 3px;
}
.hk-hof-detail {
  font-size: 0.76em; color: rgba(212,212,212,0.45);
  letter-spacing: 0.03em;
}

/* ═══════════════════════════════════════════════════════════════════════
   POST CARDS
═══════════════════════════════════════════════════════════════════════ */
.hk-posts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 2em;
}
.hk-post-card {
  display: block;
  background: #0a0a0a;
  padding: 28px 24px;
  text-decoration: none !important;
  color: inherit;
  transition: background .2s;
  position: relative;
  overflow: hidden;
}
.hk-post-card::after {
  content: '';
  position: absolute; bottom: 0; left: 0;
  width: 0; height: 2px;
  background: #00ff41;
  transition: width .3s ease;
}
.hk-post-card:hover { background: #0f0f0f; text-decoration: none !important; }
.hk-post-card:hover::after { width: 100%; }
.hk-post-card__meta {
  display: flex; gap: 12px;
  font-size: 0.7em; letter-spacing: 0.06em;
  color: rgba(0,255,65,0.45);
  margin-bottom: 10px;
}
.hk-post-card__title {
  font-size: 0.9em !important;
  font-weight: 600 !important;
  letter-spacing: 0.04em !important;
  color: #e8e8e8 !important;
  line-height: 1.35 !important;
  margin: 0 0 10px !important;
  transition: color .2s;
}
.hk-post-card:hover .hk-post-card__title { color: #00ff41 !important; }
.hk-post-card__excerpt {
  font-family: 'Inter', sans-serif !important;
  font-size: 0.82em; color: rgba(212,212,212,0.45);
  line-height: 1.6; margin: 0 0 14px;
}
.hk-post-card__arrow {
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 0.72em; color: rgba(0,255,65,0.45);
  letter-spacing: 0.1em;
  transition: color .2s, letter-spacing .2s;
}
.hk-post-card:hover .hk-post-card__arrow {
  color: #00ff41; letter-spacing: 0.18em;
}

/* pagination */
.pagination { border-top: 1px solid rgba(0,255,65,0.12) !important; margin-top: 1.5em !important; }
.pagination--pager {
  font-family: 'Share Tech Mono', monospace !important;
  border: 1px solid rgba(0,255,65,0.28) !important;
  background: transparent !important;
  border-radius: 2px !important;
  letter-spacing: 0.08em !important;
  transition: all .2s !important;
}
.pagination--pager:hover {
  background: rgba(0,255,65,0.08) !important;
  box-shadow: 0 0 14px rgba(0,255,65,0.18) !important;
  border-color: #00ff41 !important;
}

/* ═══════════════════════════════════════════════════════════════════════
   CONTACT
═══════════════════════════════════════════════════════════════════════ */
.hk-contact { text-align: center; }
.hk-contact__sub {
  font-family: 'Inter', sans-serif !important;
  font-size: 0.95em; color: rgba(212,212,212,0.55);
  max-width: 480px; margin: 0 auto 2em; line-height: 1.75;
}

/* ═══════════════════════════════════════════════════════════════════════
   INDIVIDUAL POST PAGES
═══════════════════════════════════════════════════════════════════════ */
.page__title {
  font-family: 'Orbitron', monospace !important;
  font-weight: 900 !important;
  letter-spacing: 0.05em !important;
  font-size: clamp(1.3em, 3vw, 1.9em) !important;
}
.page__content {
  font-family: 'Inter', sans-serif !important;
  font-size: 0.97em !important;
  line-height: 1.85 !important;
  color: rgba(212,212,212,0.8) !important;
}
.page__content h2, .page__content h3, .page__content h4 {
  font-family: 'Orbitron', monospace !important;
  font-weight: 600 !important;
  letter-spacing: 0.05em !important;
  color: #f0f0f0 !important;
}
.page__content a { color: #00ff41 !important; }
.page__content a:hover { text-shadow: 0 0 8px rgba(0,255,65,0.5) !important; }
:not(pre) > code {
  background: rgba(13,17,23,0.9) !important; color: #00ff41 !important;
  border: 1px solid rgba(0,255,65,0.2) !important;
  padding: .1em .38em !important; border-radius: 3px !important;
  font-size: .86em !important;
}
.highlight, pre.highlight, div.highlighter-rouge {
  border: 1px solid rgba(0,255,65,0.22) !important;
  border-radius: 4px !important;
  box-shadow: 0 0 16px rgba(0,255,65,0.04) !important;
}

/* sidebar on post pages */
.sidebar {
  font-family: 'Inter', sans-serif !important;
}
.author__name {
  font-family: 'Orbitron', monospace !important;
  font-weight: 600 !important;
  font-size: 0.85em !important;
  letter-spacing: 0.08em !important;
  color: #f0f0f0 !important;
}
.author__bio {
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 0.76em !important;
  color: rgba(212,212,212,0.5) !important;
  line-height: 1.6 !important;
}
.page__meta { font-family: 'Share Tech Mono', monospace !important; font-size: 0.72em !important; color: rgba(0,255,65,0.4) !important; }

/* ═══════════════════════════════════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════════════════════════════════ */
.page__footer {
  background: #050505 !important;
  border-top: 1px solid rgba(255,255,255,0.05) !important;
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 0.75em !important;
  color: rgba(212,212,212,0.3) !important;
}
.page__footer a { color: rgba(0,255,65,0.5) !important; }
.page__footer a:hover { color: #00ff41 !important; text-shadow: 0 0 8px rgba(0,255,65,0.4) !important; }

/* ═══════════════════════════════════════════════════════════════════════
   UTILITY
═══════════════════════════════════════════════════════════════════════ */
a { transition: color .18s, text-shadow .18s !important; }
::selection { background: rgba(0,255,65,0.2); color: #fff; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #050505; }
::-webkit-scrollbar-thumb { background: rgba(0,255,65,0.4); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: #00ff41; }

/* ═══════════════════════════════════════════════════════════════════════
   KEYFRAMES
═══════════════════════════════════════════════════════════════════════ */
@keyframes hk-blink   { 50% { opacity: 0; } }
@keyframes hk-fadeUp  { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
@keyframes hk-glitch1 {
  0%  { clip-path:inset(40% 0 61% 0); transform:translate(-3px,0); }
  25% { clip-path:inset(92% 0  1% 0); transform:translate( 3px,0); }
  50% { clip-path:inset(43% 0  1% 0); transform:translate(-2px,0); }
  75% { clip-path:inset(25% 0 58% 0); transform:translate( 2px,0); }
  100%{ clip-path:inset(54% 0  7% 0); transform:translate(-3px,0); }
}
@keyframes hk-glitch2 {
  0%  { clip-path:inset(10% 0 85% 0); transform:translate( 3px,0); color:#ff00ff; }
  33% { clip-path:inset(60% 0 30% 0); transform:translate(-3px,0); color:#00ffff; }
  66% { clip-path:inset(80% 0  5% 0); transform:translate( 2px,0); color:#ff00ff; }
  100%{ clip-path:inset( 5% 0 80% 0); transform:translate(-2px,0); color:#00ffff; }
}

/* ═══════════════════════════════════════════════════════════════════════
   SCROLL REVEAL INIT (JS sets opacity/transform, overridden after)
═══════════════════════════════════════════════════════════════════════ */
.hk-reveal { opacity: 0; transform: translateY(24px); }
.hk-reveal.hk-visible { opacity: 1; transform: translateY(0); transition: opacity .55s ease, transform .55s ease; }
</style>

<script defer src="/assets/js/hacker.js"></script>
