<!-- Kwang Security — Professional Consulting Design -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════ */
:root {
  --bg         : #06060f;
  --bg-alt     : #09091a;
  --surface    : #0d0d1c;
  --surface-2  : #12122a;
  --border     : rgba(255,255,255,0.07);
  --border-2   : rgba(255,255,255,0.12);
  --text       : #eaeaf4;
  --text-2     : rgba(234,234,244,0.55);
  --text-3     : rgba(234,234,244,0.35);
  --accent     : #4d7cfe;
  --accent-h   : #6b94ff;
  --accent-dim : rgba(77,124,254,0.18);
  --accent-glow: rgba(77,124,254,0.22);
  --r          : 8px;
  --r-sm       : 4px;
  --transition : 0.22s cubic-bezier(0.4,0,0.2,1);
}

/* ═══════════════════════════════════════════════════
   RESET / BASE
═══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
  background: var(--bg) !important;
  color: var(--text) !important;
  background-image: radial-gradient(rgba(255,255,255,0.028) 1px, transparent 1px) !important;
  background-size: 28px 28px !important;
  -webkit-font-smoothing: antialiased !important;
}

h1,h2,h3,h4,h5,h6 {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;
  color: var(--text) !important;
}

a { color: var(--accent) !important; transition: color var(--transition) !important; }
a:hover { color: var(--accent-h) !important; }

::selection { background: rgba(77,124,254,0.25); color: #fff; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(77,124,254,0.4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ═══════════════════════════════════════════════════
   MASTHEAD
═══════════════════════════════════════════════════ */
.masthead {
  background: rgba(6,6,15,0.88) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border-bottom: 1px solid var(--border) !important;
  box-shadow: 0 1px 0 rgba(77,124,254,0.08) !important;
}
.site-title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-weight: 800 !important;
  font-size: 1em !important;
  letter-spacing: -0.01em !important;
  color: var(--text) !important;
}
.site-title:hover { color: var(--accent) !important; }
.greedy-nav a, .masthead__menu-item a {
  font-family: 'Inter', sans-serif !important;
  font-size: 0.82em !important;
  font-weight: 500 !important;
  letter-spacing: 0.01em !important;
  color: var(--text-2) !important;
  transition: color var(--transition) !important;
}
.greedy-nav a:hover, .masthead__menu-item a:hover {
  color: var(--text) !important;
}

/* ═══════════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════════ */
.c-wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 5%;
}
#main { padding: 0 !important; max-width: 100% !important; float: none !important; }
#main .page {
  padding: 0 !important;
  float: none !important;
  width: 100% !important;
}

/* ═══════════════════════════════════════════════════
   LABEL
═══════════════════════════════════════════════════ */
.c-label {
  display: inline-block;
  font-family: 'Inter', sans-serif !important;
  font-size: 0.7em;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent) !important;
  margin-bottom: 0.85em;
}

/* ═══════════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════════ */
.c-btn {
  display: inline-flex; align-items: center;
  padding: 13px 28px;
  font-family: 'Inter', sans-serif !important;
  font-size: 0.85em;
  font-weight: 600;
  letter-spacing: 0.01em;
  text-decoration: none !important;
  border-radius: var(--r-sm);
  transition: all var(--transition);
  cursor: pointer;
  white-space: nowrap;
}
.c-btn--primary {
  background: var(--accent);
  color: #fff !important;
  box-shadow: 0 0 0 1px rgba(77,124,254,0.5), 0 4px 20px rgba(77,124,254,0.3);
}
.c-btn--primary:hover {
  background: var(--accent-h);
  box-shadow: 0 0 0 1px rgba(107,148,255,0.6), 0 6px 28px rgba(77,124,254,0.45);
  transform: translateY(-1px);
  color: #fff !important;
}
.c-btn--ghost {
  background: transparent;
  color: var(--text-2) !important;
  border: 1px solid var(--border-2);
}
.c-btn--ghost:hover {
  border-color: rgba(255,255,255,0.3);
  color: var(--text) !important;
  background: rgba(255,255,255,0.04);
  transform: translateY(-1px);
}
.c-btn--full { width: 100%; justify-content: center; }

/* ═══════════════════════════════════════════════════
   HERO
═══════════════════════════════════════════════════ */
.c-hero {
  position: relative;
  min-height: 92vh;
  display: flex;
  align-items: center;
  padding: 140px 5% 100px;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}
.c-hero__blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(100px);
}
.c-hero__blob--1 {
  width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(77,124,254,0.1) 0%, transparent 70%);
  top: -80px; right: 5%;
}
.c-hero__blob--2 {
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(120,80,255,0.07) 0%, transparent 70%);
  bottom: 0; left: 20%;
}
.c-hero__inner { max-width: 820px; position: relative; z-index: 2; }
.c-hero__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: clamp(2.8em, 6.5vw, 5em) !important;
  font-weight: 800 !important;
  line-height: 1.06 !important;
  letter-spacing: -0.025em !important;
  color: var(--text) !important;
  margin: 0.2em 0 0.5em !important;
}
.c-accent { color: var(--accent) !important; }
.c-hero__sub {
  font-size: 1.1em !important;
  line-height: 1.75 !important;
  color: var(--text-2) !important;
  max-width: 560px;
  margin-bottom: 2.4em !important;
}
.c-hero__cta { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 2.8em; }
.c-trust { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.c-trust__label {
  font-size: 0.72em;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
}
.c-trust__items { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.c-trust__item {
  font-size: 0.8em;
  font-weight: 600;
  color: var(--text-2);
  letter-spacing: 0.01em;
}
.c-trust__sep { color: var(--text-3); }

/* ═══════════════════════════════════════════════════
   METRICS BAR
═══════════════════════════════════════════════════ */
.c-metrics {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg-alt);
  position: relative;
  z-index: 2;
}
.c-metric {
  flex: 1;
  text-align: center;
  padding: 36px 20px;
  border-right: 1px solid var(--border);
  transition: background var(--transition);
}
.c-metric:last-child { border-right: none; }
.c-metric:hover { background: rgba(77,124,254,0.04); }
.c-metric__num {
  display: block;
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: 2.4em;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--accent) !important;
  line-height: 1;
  margin-bottom: 8px;
}
.c-metric__label {
  display: block;
  font-size: 0.68em;
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ═══════════════════════════════════════════════════
   SECTIONS
═══════════════════════════════════════════════════ */
.c-section {
  padding: 100px 0;
  border-bottom: 1px solid var(--border);
}
.c-section--alt { background: var(--bg-alt); }
.c-section__head {
  max-width: 620px;
  margin-bottom: 4em;
}
.c-section__head--row {
  max-width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 3em;
}
.c-section__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: clamp(1.8em, 3.5vw, 2.8em) !important;
  font-weight: 800 !important;
  letter-spacing: -0.025em !important;
  color: var(--text) !important;
  margin: 0 0 0.6em !important;
  line-height: 1.1 !important;
}
.c-section__sub {
  font-size: 1em;
  line-height: 1.75;
  color: var(--text-2);
  margin: 0;
}

/* ═══════════════════════════════════════════════════
   SERVICES GRID
═══════════════════════════════════════════════════ */
.c-services {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
@media (max-width: 700px) { .c-services { grid-template-columns: 1fr; } }

.c-service {
  background: var(--surface);
  padding: 40px 36px;
  transition: background var(--transition);
  position: relative;
}
.c-service::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(77,124,254,0.04) 0%, transparent 60%);
  opacity: 0;
  transition: opacity var(--transition);
}
.c-service:hover { background: var(--surface-2); }
.c-service:hover::after { opacity: 1; }
.c-service__icon {
  width: 40px; height: 40px;
  color: var(--accent);
  margin-bottom: 1.4em;
  opacity: 0.9;
}
.c-service h3 {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: 1.1em !important;
  font-weight: 700 !important;
  letter-spacing: -0.01em !important;
  color: var(--text) !important;
  margin: 0 0 0.8em !important;
}
.c-service p {
  font-size: 0.9em;
  line-height: 1.75;
  color: var(--text-2);
  margin-bottom: 1.4em;
}
.c-service__list {
  list-style: none;
  padding: 0; margin: 0;
  border-top: 1px solid var(--border);
  padding-top: 1.2em;
}
.c-service__list li {
  font-size: 0.82em;
  color: var(--text-2);
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  display: flex;
  align-items: center;
  gap: 8px;
}
.c-service__list li::before {
  content: '';
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  opacity: 0.7;
}

/* ═══════════════════════════════════════════════════
   SESSIONS / BOOKING
═══════════════════════════════════════════════════ */
.c-sessions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 2em;
}
@media (max-width: 900px) { .c-sessions { grid-template-columns: 1fr; } }

.c-session {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transition: border-color var(--transition), box-shadow var(--transition);
  position: relative;
}
.c-session:hover {
  border-color: rgba(77,124,254,0.35);
  box-shadow: 0 0 0 1px rgba(77,124,254,0.12), 0 8px 32px rgba(0,0,0,0.4);
}
.c-session--featured {
  border-color: rgba(77,124,254,0.4);
  box-shadow: 0 0 0 1px rgba(77,124,254,0.18), 0 8px 40px rgba(77,124,254,0.12);
}
.c-session__badge {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: #fff !important;
  font-size: 0.68em;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 14px;
  border-radius: 20px;
  white-space: nowrap;
}
.c-session__header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.c-session h3 {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: 1.05em !important;
  font-weight: 700 !important;
  color: var(--text) !important;
  margin: 0 !important;
}
.c-session__price {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: 1.3em;
  font-weight: 800;
  color: var(--accent) !important;
  letter-spacing: -0.02em;
}
.c-session p {
  font-size: 0.88em;
  line-height: 1.7;
  color: var(--text-2);
  margin: 0;
  flex: 1;
}
.c-session .c-service__list { border-top: 1px solid var(--border); padding-top: 1em; }
.c-session .c-btn { margin-top: auto; }
.c-booking-note {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  background: rgba(77,124,254,0.06);
  border: 1px solid rgba(77,124,254,0.14);
  border-radius: var(--r-sm);
  font-size: 0.82em;
  color: var(--text-2);
}
.c-booking-note svg { flex-shrink: 0; color: var(--accent); opacity: 0.8; }

/* ═══════════════════════════════════════════════════
   BLOG POSTS
═══════════════════════════════════════════════════ */
.c-posts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 2em;
}
@media (max-width: 900px) { .c-posts { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .c-posts { grid-template-columns: 1fr; } }

.c-post {
  background: var(--surface);
  padding: 30px 26px;
  text-decoration: none !important;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: background var(--transition);
  border-bottom: 2px solid transparent;
  color: inherit;
}
.c-post:hover {
  background: var(--surface-2);
  border-bottom-color: var(--accent);
  text-decoration: none !important;
}
.c-post__meta {
  display: flex;
  gap: 12px;
  font-size: 0.72em;
  color: var(--text-3);
  font-weight: 500;
  letter-spacing: 0.03em;
}
.c-post__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: 0.95em !important;
  font-weight: 700 !important;
  letter-spacing: -0.01em !important;
  color: var(--text) !important;
  line-height: 1.4 !important;
  margin: 0 !important;
  transition: color var(--transition) !important;
}
.c-post:hover .c-post__title { color: var(--accent) !important; }
.c-post__excerpt {
  font-size: 0.84em;
  line-height: 1.65;
  color: var(--text-2);
  margin: 0;
  flex: 1;
}
.c-post__cta {
  font-size: 0.78em;
  font-weight: 600;
  color: var(--accent);
  transition: letter-spacing var(--transition);
  margin-top: 4px;
}
.c-post:hover .c-post__cta { letter-spacing: 0.03em; }

/* pagination */
.pagination { border-top: 1px solid var(--border) !important; }
.pagination--pager {
  font-family: 'Inter', sans-serif !important;
  font-size: 0.82em !important;
  font-weight: 500 !important;
  border: 1px solid var(--border-2) !important;
  background: var(--surface) !important;
  border-radius: var(--r-sm) !important;
  color: var(--text-2) !important;
  transition: all var(--transition) !important;
}
.pagination--pager:hover {
  border-color: rgba(77,124,254,0.4) !important;
  color: var(--text) !important;
  background: var(--surface-2) !important;
}

/* ═══════════════════════════════════════════════════
   ABOUT
═══════════════════════════════════════════════════ */
.c-about {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: start;
}
@media (max-width: 780px) { .c-about { grid-template-columns: 1fr; gap: 3em; } }

.c-about__text p {
  font-size: 0.97em;
  line-height: 1.85;
  color: var(--text-2);
  margin-bottom: 1.3em;
}
.c-about__text .c-section__title { margin-bottom: 0.5em !important; }
.c-recog__title {
  font-size: 0.68em;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 1.2em;
}
.c-recog-list { display: flex; flex-direction: column; }
.c-recog-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.c-recog-item:first-child { border-top: 1px solid var(--border); }
.c-recog__org {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: 0.88em;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}
.c-recog__finding {
  font-size: 0.8em;
  color: var(--text-2);
  line-height: 1.5;
}

/* ═══════════════════════════════════════════════════
   CONTACT CTA
═══════════════════════════════════════════════════ */
.c-cta {
  position: relative;
  padding: 120px 5%;
  text-align: center;
  overflow: hidden;
  background: var(--bg-alt);
}
.c-cta__blob {
  position: absolute;
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(77,124,254,0.09) 0%, transparent 65%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  filter: blur(60px);
  pointer-events: none;
}
.c-cta__inner { position: relative; z-index: 2; }
.c-cta__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-size: clamp(1.8em, 3.5vw, 2.8em) !important;
  font-weight: 800 !important;
  letter-spacing: -0.025em !important;
  color: var(--text) !important;
  margin: 0 auto 0.8em !important;
  max-width: 600px;
  line-height: 1.15 !important;
}
.c-cta__sub {
  font-size: 1em;
  color: var(--text-2);
  max-width: 480px;
  margin: 0 auto 2.4em;
  line-height: 1.75;
}
.c-cta__actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

/* ═══════════════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════════════ */
.page__footer {
  background: var(--bg) !important;
  border-top: 1px solid var(--border) !important;
  font-family: 'Inter', sans-serif !important;
  font-size: 0.8em !important;
  color: var(--text-3) !important;
}
.page__footer a { color: var(--text-3) !important; }
.page__footer a:hover { color: var(--text-2) !important; }

/* ═══════════════════════════════════════════════════
   POST PAGE (single.html)
═══════════════════════════════════════════════════ */
.page__title {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-weight: 800 !important;
  letter-spacing: -0.025em !important;
  font-size: clamp(1.5em, 3.5vw, 2.2em) !important;
  line-height: 1.2 !important;
}
.page__content {
  font-family: 'Inter', sans-serif !important;
  font-size: 1em !important;
  line-height: 1.85 !important;
  color: rgba(234,234,244,0.8) !important;
}
.page__content h2, .page__content h3, .page__content h4 {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-weight: 700 !important;
  letter-spacing: -0.015em !important;
  color: var(--text) !important;
}
.page__content a { color: var(--accent) !important; }
.page__content a:hover { color: var(--accent-h) !important; }
:not(pre) > code {
  background: var(--surface) !important;
  color: #a5b4fc !important;
  border: 1px solid var(--border-2) !important;
  padding: .12em .38em !important;
  border-radius: 4px !important;
  font-size: .86em !important;
}
.highlight, pre.highlight, div.highlighter-rouge {
  border: 1px solid var(--border) !important;
  border-radius: var(--r-sm) !important;
}

/* ═══════════════════════════════════════════════════
   SIDEBAR (post pages)
═══════════════════════════════════════════════════ */
.author__name {
  font-family: 'Plus Jakarta Sans', sans-serif !important;
  font-weight: 700 !important;
  font-size: 0.95em !important;
  color: var(--text) !important;
}
.author__bio { color: var(--text-2) !important; font-size: 0.82em !important; }
.page__meta { color: var(--text-3) !important; font-size: 0.78em !important; }

/* ═══════════════════════════════════════════════════
   SCROLL REVEAL
═══════════════════════════════════════════════════ */
.c-reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.55s ease, transform 0.55s ease;
