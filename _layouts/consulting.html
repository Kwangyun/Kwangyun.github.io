<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - Kwangyun Keum</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      color: #1a1a1a;
      line-height: 1.6;
      background: linear-gradient(135deg, #ffffff 0%, #f5f7ff 100%);
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 120px 40px;
      text-align: center;
      border-bottom: 8px solid #764ba2;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.1;
      background-image: radial-gradient(circle at 20% 80%, #fff 1px, transparent 1px),
                        radial-gradient(circle at 80% 20%, #fff 1px, transparent 1px);
      background-size: 100px 100px;
      pointer-events: none;
    }

    .hero-content {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 40px;
      opacity: 0.95;
      line-height: 1.8;
    }

    .cta-button {
      display: inline-block;
      background: #fff;
      color: #667eea;
      padding: 16px 40px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      background: #f0f0f0;
    }

    .cta-button.secondary {
      background: transparent;
      color: white;
      border: 2px solid white;
      margin-left: 20px;
    }

    .cta-button.secondary:hover {
      background: white;
      color: #667eea;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* Services Section */
    .services {
      padding: 100px 40px;
      background: white;
    }

    .section-title {
      text-align: center;
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1a1a1a;
    }

    .section-subtitle {
      text-align: center;
      font-size: 18px;
      color: #666;
      margin-bottom: 60px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 40px;
      margin-bottom: 60px;
    }

    .service-card {
      background: linear-gradient(135deg, #f5f7ff 0%, #ffffff 100%);
      padding: 40px;
      border-radius: 15px;
      border-left: 5px solid #667eea;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .service-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(102, 126, 234, 0.15);
      border-left-color: #764ba2;
    }

    .service-icon {
      font-size: 40px;
      margin-bottom: 20px;
    }

    .service-card h3 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #1a1a1a;
    }

    .service-card p {
      color: #666;
      line-height: 1.8;
    }

    /* Process Timeline */
    .process {
      padding: 100px 40px;
      background: linear-gradient(135deg, #f9f9f9 0%, #ffffff 100%);
    }

    .timeline {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      position: relative;
    }

    .timeline::before {
      content: '';
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(to right, #667eea, #764ba2, #667eea);
      z-index: 0;
      display: none;
    }

    @media (min-width: 1024px) {
      .timeline::before {
        display: block;
      }
    }

    .timeline-item {
      position: relative;
      z-index: 1;
    }

    .timeline-dot {
      position: absolute;
      left: 0;
      top: -30px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: 4px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 20px;
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
    }

    @media (max-width: 1023px) {
      .timeline-dot {
        left: 15px;
      }
    }

    .timeline-content {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      margin-top: 50px;
      position: relative;
      border-top: 4px solid #667eea;
      transition: all 0.3s ease;
    }

    .timeline-content:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.15);
    }

    .timeline-content h4 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #1a1a1a;
      font-weight: 700;
    }

    .timeline-content .duration {
      font-size: 14px;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 15px;
      display: block;
    }

    .timeline-content p {
      color: #666;
      line-height: 1.8;
      font-size: 15px;
    }

    /* Comparison Section */
    .comparison {
      padding: 100px 40px;
      background: white;
    }

    .comparison-table {
      max-width: 1000px;
      margin: 0 auto;
      overflow-x: auto;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    table th {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 25px;
      text-align: left;
      font-weight: 600;
    }

    table td {
      padding: 20px 25px;
      border-bottom: 1px solid #eee;
      color: #666;
    }

    table tr:hover {
      background: #f9f9f9;
    }

    table tr:last-child td {
      border-bottom: none;
    }

    .check {
      color: #4CAF50;
      font-weight: bold;
      font-size: 18px;
    }

    .cross {
      color: #f44336;
      font-weight: bold;
      font-size: 18px;
    }

    /* Testimonials */
    .testimonials {
      padding: 100px 40px;
      background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
    }

    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .testimonial-card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .stars {
      color: #FFB800;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .testimonial-card p {
      color: #666;
      margin-bottom: 20px;
      font-style: italic;
      line-height: 1.8;
    }

    .testimonial-author {
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 5px;
    }

    .testimonial-role {
      color: #999;
      font-size: 14px;
    }

    /* CTA Section */
    .cta-section {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 80px 40px;
      text-align: center;
      border-top: 8px solid #764ba2;
    }

    .cta-section h2 {
      font-size: 42px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .cta-section p {
      font-size: 18px;
      margin-bottom: 40px;
      opacity: 0.95;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Footer Section */
    footer {
      background: #1a1a1a;
      color: #fff;
      padding: 40px;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 36px;
      }

      .hero p {
        font-size: 16px;
      }

      .section-title {
        font-size: 32px;
      }

      .timeline {
        grid-template-columns: 1fr;
      }

      .timeline::before {
        display: none;
      }

      .timeline-dot {
        left: 20px;
        top: -20px;
        width: 50px;
        height: 50px;
        font-size: 18px;
      }

      .timeline-content {
        margin-top: 40px;
        margin-left: 70px;
        padding: 30px;
      }

      .cta-button.secondary {
        display: block;
        margin-left: 0;
        margin-top: 15px;
      }

      .comparison-table table {
        font-size: 14px;
      }

      table th, table td {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  {{ content }}

  <footer>
    <p>&copy; 2026 Kwangyun Keum. All rights reserved. | <a href="/" style="color: #667eea; text-decoration: none;">Back to Home</a></p>
  </footer>
</body>
</html>
